<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Code Quiz: Stat! — Bones & the Axial Skeleton (Ch 6–7)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0518; --panel:#160a1f; --panel2:#22102f;
    --line:#7a3aa0; --text:#fdf7ff; --muted:#d2bee6;
    --phos:#ff3ca6; --quiz:#ff3ca6; --good:#2ad4ff; --bad:#ff3b3b; --gold:#ffd45e; --purple:#b388ff;
    --px:'Press Start 2P','Courier New',monospace;
    --rt:'VT323','Courier New',monospace;
    --bevel: inset -3px -3px 0 0 rgba(0,0,0,.5), inset 3px 3px 0 0 rgba(255,255,255,.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{height:100%;}
  body{margin:0;
    font-family:var(--rt); font-size:23px; letter-spacing:.2px;
    background:var(--bg); background-attachment:fixed;
    color:var(--text); overflow-x:hidden; user-select:none; min-height:100%;
  }
  .choice,.cell,.btn,.iconbtn,.backbtn{touch-action:manipulation;}
  /* CRT overlay */
  #crt{position:fixed;inset:0;pointer-events:none;z-index:60;}
  #crt::before{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(rgba(255,255,255,.005) 0 2px, rgba(0,0,0,.04) 2px 5px);}
  #crt::after{content:"";position:absolute;inset:0;
    background:radial-gradient(140% 140% at 50% 50%, transparent 70%, rgba(0,0,0,.28) 100%);
    animation:flicker 6s infinite steps(40);}
  @keyframes flicker{0%,100%{opacity:1}48%{opacity:.98}50%{opacity:.96}52%{opacity:.99}}
  #scanbar{position:fixed;left:0;right:0;height:60px;pointer-events:none;z-index:59;
    background:linear-gradient(to bottom, transparent, rgba(255,60,166,.06), transparent);
    animation:scan 7s linear infinite;}
  @keyframes scan{0%{top:-60px}100%{top:100%}}

  #app{min-height:100vh; display:flex; flex-direction:column; transition:transform .05s; position:relative; z-index:2;}
  #app.shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,-3px)}80%{transform:translate(6px,3px)}}

  header{display:flex; align-items:center; gap:14px; padding:12px 18px;
    background:var(--panel); border-bottom:4px solid var(--line); position:sticky; top:0; z-index:5; flex-wrap:wrap; row-gap:8px;}
  header .logo{font-family:var(--px); font-size:14px; line-height:1.5; color:var(--phos); display:flex; align-items:center; gap:10px; text-shadow:0 0 8px var(--phos);}
  header .logo .tagline{color:var(--muted);font-size:9px;text-shadow:none;}
  .pulse{color:var(--bad); font-size:18px; text-shadow:0 0 10px var(--bad); animation:beat 1s infinite; display:inline-block;}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.5)}30%{transform:scale(1)}45%{transform:scale(1.3)}}
  header .spacer{flex:1;}

  .iconbtn,.backbtn,.btn{font-family:var(--px); cursor:pointer; border:none; color:var(--text);
    background:var(--panel2); box-shadow:var(--bevel), 0 4px 0 #0a0418; transition:transform .06s, box-shadow .06s, background .1s;}
  .iconbtn{font-size:14px; padding:10px 12px;}
  .backbtn{font-size:10px; padding:10px 12px; color:var(--phos);}
  .iconbtn:active,.backbtn:active,.btn:active{transform:translateY(4px); box-shadow:var(--bevel);}
  .iconbtn:hover,.backbtn:hover{filter:brightness(1.2);}

  main{flex:1; padding:18px 18px 104px; position:relative; z-index:2;}
  .game{max-width:1040px;margin:0 auto;}
  .game h2{font-family:var(--px); margin:0 0 10px; font-size:18px; color:var(--quiz); text-shadow:0 0 5px var(--quiz); line-height:1.4;}
  .game .sub{color:var(--muted);margin:0 0 16px;font-size:20px;line-height:1.4;}

  /* stats + combo */
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center;}
  .stat{background:var(--panel);box-shadow:var(--bevel);padding:8px 14px;font-size:19px;color:var(--text);border-left:4px solid var(--line);}
  .stat b{font-family:var(--px);font-size:14px;color:var(--gold);text-shadow:0 0 3px var(--gold);}
  .combo{margin-left:auto;display:flex;align-items:center;gap:10px;}
  .combo .lab{color:var(--muted);font-size:17px;}
  .multi{font-family:var(--px);font-size:14px;padding:8px 12px;background:var(--gold);color:#3a2400;box-shadow:var(--bevel);}
  .multi.bump{animation:multibump .5s;}
  @keyframes multibump{0%{transform:scale(1)}40%{transform:scale(1.5);filter:brightness(1.4)}100%{transform:scale(1)}}
  .combobar,.progress,.timerbar{background:#120726;box-shadow:var(--bevel);overflow:hidden;}
  .combobar{width:130px;height:16px;}
  .combobar > i{display:block;height:100%;width:0;transition:width .3s;
    background:repeating-linear-gradient(90deg,var(--gold) 0 8px, #c98a00 8px 10px);}
  .progress{height:16px;margin:0 0 16px;}
  .progress > i{display:block;height:100%;width:0;transition:width .4s steps(20);
    background:repeating-linear-gradient(90deg,var(--quiz) 0 8px, #8a1f5a 8px 10px);}
  .timerbar{height:18px;margin-bottom:14px;}
  .timerbar > i{display:block;height:100%;width:100%;
    background:repeating-linear-gradient(90deg,var(--good) 0 10px, #120726 10px 12px);}

  .prompt{background:var(--panel2);box-shadow:var(--bevel),0 0 24px rgba(255,60,166,.3);padding:22px 24px;margin-bottom:18px;font-size:30px;line-height:1.5;border-left:7px solid var(--quiz);color:var(--text);}

  .qtop{text-align:right;margin-bottom:8px;}
  .qclose{font-family:var(--rt);font-size:16px;background:var(--panel);color:var(--muted);border:none;box-shadow:var(--bevel);padding:8px 12px;cursor:pointer;touch-action:manipulation;}
  .qclose:hover{color:var(--text);filter:brightness(1.2);}
  .choices{display:grid;gap:12px;}
  .choice{font-family:var(--rt);font-size:27px;line-height:1.3;background:var(--panel2);box-shadow:var(--bevel),0 4px 0 #0a0418;padding:18px 20px;cursor:pointer;text-align:left;color:var(--text);border-left:4px solid var(--line);transition:transform .06s,filter .1s,border-color .1s;}
  .choice:hover{filter:brightness(1.25);}
  .choice:active{transform:translateY(4px);box-shadow:var(--bevel);}
  .choice.correct{background:#0a2536;color:var(--good);box-shadow:var(--bevel),0 0 16px var(--good);animation:popcorrect .4s;}
  .choice.wrong{background:#3a0c12;color:var(--bad);box-shadow:var(--bevel),0 0 16px var(--bad);animation:nudge .3s;}
  @keyframes popcorrect{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
  @keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .btn{font-size:13px;padding:14px 20px;background:var(--quiz);color:#02232b;}
  .btn:hover{filter:brightness(1.15);}
  .btn.ghost{background:var(--panel2);color:var(--text);}

  .feedback{margin-top:14px;padding:14px 16px;font-size:21px;line-height:1.55;display:none;box-shadow:var(--bevel);}
  .feedback.show{display:block;animation:fadeup .3s;}
  @keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .feedback.ok{background:#0a2230;border-left:5px solid var(--good);}
  .feedback.no{background:#2c0a10;border-left:5px solid var(--bad);}
  .feedback .term{font-family:var(--px);font-size:13px;color:var(--gold);text-shadow:0 0 2px var(--gold);}
  .defmain{font-size:20px;line-height:1.45;margin:9px 0 7px;color:var(--text);}
  .defs{margin-top:12px;display:grid;gap:6px;text-align:left;border-top:1px solid var(--line);padding-top:10px;}
  .defslabel{font-family:var(--px);font-size:9px;color:var(--muted);letter-spacing:1px;margin-bottom:2px;}
  .optdef{font-size:16px;line-height:1.35;color:var(--muted);}
  .optdef b{color:var(--text);}
  .learnrow{margin:2px 0 8px;font-size:16px;}
  .learnmore{color:var(--quiz);text-decoration:none;font-family:var(--rt);border-bottom:1px dotted var(--quiz);white-space:nowrap;}
  .learnmore:hover{filter:brightness(1.25);}

  /* board */
  .board{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;transition:opacity .25s,filter .25s;}
  .board.dim{opacity:.32;filter:saturate(.6);}
  /* phone two-step board: category select -> values */
  .board.mob{display:grid;grid-template-columns:1fr;gap:8px;}
  .mcat{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--rt);font-size:21px;font-weight:bold;background:#2b1240;box-shadow:var(--bevel),0 4px 0 #0a0418;padding:15px 16px;color:var(--phos);cursor:pointer;}
  .mcat:active{transform:translateY(4px);box-shadow:var(--bevel);}
  .mcat .mleft{font-family:var(--px);font-size:11px;color:var(--gold);white-space:nowrap;}
  .mcat.done{opacity:.4;} .mcat.done .mleft{color:var(--muted);}
  .mvtop{display:flex;align-items:center;gap:12px;margin-bottom:4px;}
  .mback{font-family:var(--px);font-size:12px;background:var(--panel2);color:var(--text);border:none;box-shadow:var(--bevel),0 4px 0 #0a0418;padding:11px 13px;cursor:pointer;}
  .mback:active{transform:translateY(4px);box-shadow:var(--bevel);}
  .mvtitle{font-family:var(--rt);font-size:21px;font-weight:bold;color:var(--phos);}
  .mvals{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;}
  .mvals .cell{font-size:18px;padding:24px 2px;}
  .cat{font-family:var(--rt);font-weight:bold;background:var(--panel);color:var(--phos);box-shadow:var(--bevel);padding:8px 4px;text-align:center;font-size:18px;line-height:1.1;min-height:48px;display:flex;align-items:center;justify-content:center;text-shadow:0 0 2px var(--phos);}
  .cell{position:relative;font-family:var(--px);background:#2b1240;box-shadow:var(--bevel),0 4px 0 #0a0418;padding:18px 4px;text-align:center;font-size:16px;color:var(--gold);cursor:pointer;transition:transform .1s,filter .1s;opacity:0;transform:scale(.5);text-shadow:none;}
  .cell.in{animation:cellin .4s forwards;}
  @keyframes cellin{to{opacity:1;transform:scale(1);}}
  .cell:hover{filter:brightness(1.3);}
  .cell:active{transform:translateY(4px);box-shadow:var(--bevel);}
  .cell.bonus{background:#5a1577;color:#fff;box-shadow:var(--bevel),0 4px 0 #0a0418,0 0 16px var(--purple);}
  .cell.bonus::after{content:"⚡";position:absolute;top:2px;right:5px;font-size:12px;}
  .cell.flip{animation:flip .35s;}
  @keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg) scale(1.1)}100%{transform:rotateY(0)}}
  .cell.used{background:#1a0e26;color:var(--muted);cursor:default;filter:none;opacity:.35;box-shadow:var(--bevel);text-shadow:none;}
  .cell.used:hover{transform:none;filter:none;}

  .bonusbanner{font-family:var(--px);text-align:center;font-size:16px;color:var(--purple);margin-bottom:12px;animation:bonusflash .8s;text-shadow:0 0 18px var(--purple);}
  @keyframes bonusflash{0%{transform:scale(.4);opacity:0}40%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:1}}

  /* results */
  .done-screen{text-align:center;padding:14px;}
  .rank-badge{font-family:var(--px);font-size:22px;margin:10px 0;line-height:1.5;animation:badgein .7s cubic-bezier(.2,1.3,.4,1);}
  @keyframes badgein{0%{transform:scale(0) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
  .done-screen .big{font-family:var(--px);font-size:40px;color:var(--gold);text-shadow:0 0 24px var(--gold);margin:8px 0;}
  .donestats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0;}
  .reviewlist{text-align:left;max-width:620px;margin:0 auto;display:grid;gap:10px;}
  /* splash / intro screen */
  .splash{max-width:680px;margin:0 auto;text-align:center;padding-top:6px;animation:reportin .5s cubic-bezier(.2,1.2,.4,1);}
  .splash-bots{display:flex;gap:26px;justify-content:center;margin-bottom:4px;}
  .splash-bots .repbot{display:inline-block;animation:docbob 3s ease-in-out infinite;}
  .splash-bots .repbot:last-child{animation-delay:.6s;}
  .splash-bots .repface{width:92px;}
  .splash-title{font-family:var(--px);font-size:30px;color:var(--quiz);text-shadow:0 0 12px var(--quiz);margin:8px 0;line-height:1.35;}
  .splash-sub{color:var(--muted);font-size:19px;margin:0 0 18px;line-height:1.4;}
  .splash-card{background:var(--panel2);box-shadow:var(--bevel);padding:16px 18px;text-align:left;display:grid;gap:11px;font-size:20px;line-height:1.4;max-width:580px;margin:0 auto 18px;}
  .splash-card p{margin:0;}
  .splash-card b{color:var(--gold);}
  .splash-ask{font-family:var(--px);font-size:15px;color:var(--good);margin:8px 0 16px;text-shadow:0 0 6px var(--good);}
  .splash-go{font-size:22px;padding:16px 44px;animation:gopulse 1.3s ease-in-out infinite;}
  @keyframes gopulse{0%,100%{transform:translateY(0);filter:drop-shadow(0 0 4px var(--quiz))}50%{transform:translateY(-3px);filter:drop-shadow(0 0 18px var(--quiz))}}

  .splash-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  /* leaderboard */
  .lblist{max-width:520px;margin:0 auto;display:grid;gap:6px;}
  .lbrow{display:grid;grid-template-columns:36px 1fr auto auto;gap:10px;align-items:center;background:var(--panel2);box-shadow:var(--bevel);padding:10px 12px;font-size:19px;}
  .lbrank{font-family:var(--px);font-size:13px;color:var(--gold);text-align:center;}
  .lbname{font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lbscore{font-family:var(--px);font-size:13px;color:var(--quiz);}
  .lbcorrect{font-size:15px;color:var(--muted);}
  .lbrow.me{box-shadow:var(--bevel),0 0 14px var(--good);outline:2px solid var(--good);}
  .lbentry{background:var(--panel2);box-shadow:var(--bevel),0 0 16px rgba(255,212,94,.28);padding:14px;margin:0 auto 18px;max-width:540px;}
  .lbentry-t{font-size:18px;line-height:1.4;margin-bottom:12px;text-align:center;}
  .lbentry-t b{color:var(--gold);}
  .lbentry .lbsubmit{margin-top:0;}
  .lbdone{font-family:var(--px);font-size:13px;color:var(--good);text-align:center;margin:0 auto 14px;}
  .lbdone b{color:var(--gold);}
  .lbsubmit{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center;margin-top:20px;}
  input,textarea{-webkit-user-select:text;user-select:text;}
  #lbName{font-family:var(--rt);font-size:20px;padding:12px 14px;background:#0c0518;color:var(--text);border:none;box-shadow:var(--bevel);width:190px;text-transform:uppercase;letter-spacing:1px;-webkit-user-select:text;user-select:text;pointer-events:auto;touch-action:manipulation;}
  #lbName::placeholder{color:var(--muted);}

  .rounds{margin-top:22px;}
  .rounds-head{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:16px;flex-wrap:wrap;}
  .rounds-cap{font-family:var(--px);font-size:12px;color:var(--muted);text-align:left;line-height:1.6;max-width:380px;}
  .rounds-cap span{font-family:var(--rt);font-size:18px;color:var(--text);}
  .review{background:var(--panel2);box-shadow:var(--bevel);padding:12px 14px;margin-bottom:10px;text-align:left;}
  .rev-term{font-family:var(--px);font-size:14px;color:var(--gold);text-shadow:0 0 4px var(--gold);}
  .rev-def{font-size:20px;color:var(--text);margin:8px 0 7px;line-height:1.4;}
  .rev-why{font-size:19px;color:var(--good);line-height:1.5;}
  .rev-why b{font-family:var(--px);font-size:9px;color:var(--quiz);margin-right:8px;letter-spacing:.5px;}
  .report{background:var(--panel2);box-shadow:var(--bevel),0 0 24px rgba(255,212,94,.22);padding:18px;margin:0 auto 22px;max-width:680px;text-align:left;animation:reportin .55s cubic-bezier(.2,1.2,.4,1);}
  @keyframes reportin{0%{opacity:0;transform:scale(.85) translateY(24px)}100%{opacity:1;transform:none}}
  .rep-title{font-family:var(--px);font-size:12px;color:var(--muted);margin-bottom:14px;letter-spacing:2px;text-align:center;}
  .verdict{font-family:var(--px);font-size:24px;line-height:1.4;text-align:center;padding:16px;margin-bottom:12px;box-shadow:var(--bevel);animation:verdpulse 1.5s ease-in-out infinite;}
  @keyframes verdpulse{0%,100%{filter:drop-shadow(0 0 3px currentColor)}50%{filter:drop-shadow(0 0 18px currentColor)}}
  .verdict.perfect,.verdict.saved{color:var(--good);}
  .verdict.stable{color:var(--gold);}
  .verdict.critical{color:var(--bad);}
  .diagnosis{font-family:var(--rt);font-size:22px;text-align:center;background:#0c0518;box-shadow:var(--bevel);padding:13px 14px;margin-bottom:16px;line-height:1.4;color:var(--muted);}
  .diagnosis b{display:inline-block;margin-top:6px;font-family:var(--px);font-size:15px;line-height:1.7;color:var(--gold);text-shadow:0 0 8px var(--gold);}
  .rep-line{display:flex;gap:12px;align-items:center;margin-bottom:12px;opacity:0;animation:repline .5s ease forwards;}
  @keyframes repline{0%{opacity:0;transform:translateX(-14px)}100%{opacity:1;transform:none}}
  .repbot{flex:0 0 auto;}
  .repface{width:58px;height:auto;display:block;image-rendering:pixelated;filter:drop-shadow(0 0 3px var(--neon));}
  .rep-bubble{background:var(--panel);box-shadow:var(--bevel);padding:11px 13px;font-size:20px;line-height:1.35;flex:1;}
  .rep-bubble b{font-family:var(--px);font-size:11px;}
  .rep-bubble.m b{color:#ff3ca6;} .rep-bubble.c b{color:#2ad4ff;}

  .floatpop{position:fixed;pointer-events:none;font-family:var(--px);font-size:18px;z-index:50;text-shadow:0 0 10px currentColor;animation:floatup 1s forwards;}
  .wordzoom{position:fixed;left:50%;top:42%;z-index:52;pointer-events:none;font-family:var(--rt);font-weight:bold;font-size:46px;line-height:1.1;text-align:center;max-width:92vw;color:var(--good);text-shadow:0 0 22px var(--good);opacity:0;}
  .wordzoom.go{animation:wordzoomk 1.05s cubic-bezier(.2,.7,.3,1) forwards;}
  @keyframes wordzoomk{0%{opacity:0;transform:translate(-50%,-50%) scale(.45);}18%{opacity:1;transform:translate(-50%,-50%) scale(1.05);}100%{opacity:0;transform:translate(-50%,-50%) scale(2.7);}}
  @keyframes floatup{0%{transform:translateY(0) scale(.6);opacity:0}20%{transform:translateY(-8px) scale(1.1);opacity:1}100%{transform:translateY(-70px) scale(1);opacity:0}}

  /* ===== cyberpunk medics ===== */
  .doc{position:fixed;bottom:30px;width:150px;z-index:3;pointer-events:none;--neon:#ff3ca6;transform-origin:bottom center;animation:docbob 3.4s ease-in-out infinite;transition:left .35s ease,right .35s ease;}
  .doc.left{left:40px;}
  .doc.right{right:40px;--neon:#2ad4ff;animation-delay:.7s;}
  .doc.tuck.left{left:-52px;}    /* slide out of the way while a question is open */
  .doc.tuck.right{right:-52px;}
  .doc.right .docsvg{transform:scaleX(-1);}
  .docsvg{width:100%;height:auto;display:block;filter:drop-shadow(0 0 3px var(--neon));}
  .emo{position:absolute;top:-12px;left:50%;font-size:32px;opacity:0;pointer-events:none;line-height:1;filter:drop-shadow(0 0 4px rgba(0,0,0,.5));}
  .emo.show{animation:emopop 1.2s ease;}
  @keyframes emopop{0%{opacity:0;transform:translate(-50%,8px) scale(.3)}18%{opacity:1;transform:translate(-50%,-4px) scale(1.3)}70%{opacity:1;transform:translate(-50%,-16px) scale(1)}100%{opacity:0;transform:translate(-50%,-34px) scale(1)}}
  .coat{fill:#eaf0ff;} .metal{fill:#241d38;} .mask{fill:#3a2f57;} .glove{fill:#2a2440;}
  .ol{stroke:var(--neon);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;}
  .nofill{fill:none;}
  .neonfill,.visor,.emblem{fill:var(--neon);}
  .led{fill:var(--gold);animation:vled 1.2s infinite;}
  .seam,.vent,.steth{opacity:.7;}
  .joint{fill:#e4e8f2;stroke:#aeb6c8;stroke-width:1.5;}
  .arm{fill:none;stroke:#cfd5e2;stroke-width:5;stroke-linecap:round;}
  .spring{fill:none;stroke:#aeb6c8;stroke-width:2.5;}
  .gloss{fill:rgba(255,255,255,.4);}
  .cross{fill:#ff3b3b;}
  .pixg{fill:#cfd5e2;}
  .mp{fill:#20142e;}
  .scr{fill:#141021;}
  .clip{fill:#caa24a;}
  .eyeshine{fill:#ffffff;}
  .blush{fill:#ff8fb0;opacity:.9;}
  .mo{display:none;}
  .sweat{fill:#7fd4ff;display:none;transform-box:fill-box;transform-origin:center;}
  .armR{transform-box:fill-box;transform-origin:80% 0;transition:transform .25s ease;}

/* generic monitor activity trace — a gentle rolling waveform (no specific clinical meaning) */
function wavePath(mx,my,mw,mh){
  const base=my+mh*0.55, h=mh*0.28;   // baseline + gentle amplitude
  // [x-fraction of one cycle, y offset * h]  (negative = upward)
  const pat=[[0,0],[.12,-.7],[.25,0],[.37,.7],[.5,0],[.62,-.7],[.75,0],[.87,.7],[1,0]];
  const beatW=44; let d="", started=false;
  for(let bx=mx+3; bx<mx+mw-4; bx+=beatW){
    for(const p of pat){ const X=bx+p[0]*beatW; if(X>mx+mw-3) break; const Y=base+p[1]*h; d+=(started?" L":"M")+X.toFixed(1)+" "+Y.toFixed(1); started=true; }
  }
  return d;
}

function buildCity(){
  const W=480,H=260; let s=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMax slice" class="citysvg">`;
  s+=`<rect x="0" y="0" width="${W}" height="${H}" fill="#0c0a16"/>`;                       // wall
  for(let i=0;i<5;i++) s+=`<rect x="${18+i*96}" y="9" width="66" height="4" fill="#2ad4ff" opacity=".35"/>`;  // ceiling light strips
  s+=`<rect x="0" y="170" width="${W}" height="3" fill="#ff3ca6" opacity=".45"/>`;          // baseboard neon
  s+=`<g class="hcross"><rect x="${W/2-6}" y="38" width="12" height="44"/><rect x="${W/2-22}" y="54" width="44" height="12"/></g>`;  // cross sign
  for(let i=0;i<4;i++){ const mw=70,mh=40,mx=36+i*122,my=96;                                 // wall vital monitors
    if(Math.abs(mx+mw/2 - W/2) < 46) continue;                                                // skip behind the cross
    s+=`<rect x="${mx}" y="${my}" width="${mw}" height="${mh}" fill="#04140d" stroke="#1f7a4d" stroke-width="1"/>`;
    const col=i%2?'#2ad4ff':'#39ff14';
    s+=`<path d="${wavePath(mx,my,mw,mh)}" fill="none" stroke="${col}" stroke-width="1.5" opacity=".78"/>`;
  }
  for(let i=0;i<2;i++){ const bx=64+i*232, by=204;                                            // beds + IV stands
    s+=`<rect x="${bx}" y="${by}" width="120" height="10" fill="#2a2440"/>`;
    s+=`<rect x="${bx+6}" y="${by-15}" width="108" height="17" rx="4" fill="#cdd9e8" opacity=".22"/>`;
    s+=`<rect x="${bx+8}" y="${by-13}" width="26" height="13" rx="3" fill="#cdd9e8" opacity=".4"/>`;
    s+=`<rect x="${bx+4}" y="${by-16}" width="112" height="2" fill="#2ad4ff" opacity=".4"/>`;
    s+=`<rect x="${bx}" y="${by+10}" width="6" height="18" fill="#2a2440"/><rect x="${bx+114}" y="${by+10}" width="6" height="18" fill="#2a2440"/>`;
    const ix=bx+132; s+=`<rect x="${ix}" y="${by-52}" width="3" height="76" fill="#9fb2c9" opacity=".5"/><rect x="${ix-6}" y="${by-60}" width="14" height="16" rx="2" fill="#2ad4ff" opacity=".45"/>`;
  }
  return s+`</svg>`;
}

  const t=$("#ticker"); if(!t)return;

  const line=`<div class="tk-line"><b style="color:${col}">${name}</b> ${text}</div>`;

  else t.innerHTML+=line;                // Cyan's reply appends below — both stay visible
  t.classList.remove("on"); void t.offsetWidth; t.classList.add("on");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),6500);  // auto-hide after the exchange
}
function converse(m,c,cls){

  clearTimeout(cvT); cvT=setTimeout(()=>{ bubble("R",c,cls); tick("C",c); },850);  // Dr. Cyan replies

function pickPair(a){return a[Math.random()*a.length|0];}
function banter(ctx){
  if(ctx.timedOut) return Object.assign({cls:'bad'},pickPair([
    {m:"Too slow — missed the window!",c:"Watch the clock, doctor."},
    {m:"Time's up on that one!",c:"Quicker on the next call."}]));
  if(!ctx.right){
    if(ctx.hp<=20) return Object.assign({cls:'bad'},pickPair([
      {m:"They're CRASHING!",c:"We can't lose another one!"},
      {m:"Flatline warning!",c:"Pull it together, doctor!"}]));
    if(ctx.hp<=45) return Object.assign({cls:'bad'},pickPair([
      {m:"Wrong call — vitals dipping.",c:"Shake it off, refocus."},
      {m:"That one hurt the patient.",c:"Read the chart next time."}]));
    return Object.assign({cls:'bad'},pickPair([
      {m:"Oof, not quite.",c:"Happens — stay sharp."},
      {m:"That's not the one.",c:"We'll get the next."}]));
  }
  if(ctx.bonus) return Object.assign({cls:'bonus'},pickPair([
    {m:"Bonus nailed — double points!",c:"Now THAT'S a doctor!"},
    {m:"Jackpot tile, clean hit!",c:"Show-off."}]));
  if(ctx.streak>=6) return Object.assign({cls:'combo'},pickPair([
    {m:"They're UNSTOPPABLE!",c:ctx.streak+" straight — record pace!"},
    {m:"Can't miss today!",c:"Best run all shift!"}]));
  if(ctx.streak>=3) return Object.assign({cls:'combo'},pickPair([
    {m:"Another clean call!",c:"That's "+ctx.streak+" in a row!"},
    {m:"On a roll!",c:"Keep that combo alive!"}]));
  if(ctx.hp>=90) return Object.assign({cls:'good'},pickPair([
    {m:"Patient's thriving.",c:"Textbook work, doctor."},
    {m:"Vitals look perfect.",c:"Nice and steady."}]));
  return Object.assign({cls:'good'},pickPair([
    {m:"Good call.",c:"Vitals holding."},
    {m:"Correct — nice.",c:"Onward, doctor."}]));
}
function idleBanter(){
  if(Math.random()<0.12){ setEmo('sleep'); converse("*yawn*","💤 quiet shift…",'good'); return; }   // sleepy idle
  if(Math.random()<0.22){                                // every so often: praise the creator, David
    const d=pickPair([
      {m:"You know who built us?",c:"David. Absolute genius."},

      {m:"What's the skull's keystone bone?",c:"The sphenoid — it touches every other cranial bone."},

      {m:"What forms the lower jaw?",c:"The mandible — the only movable skull bone."}
    ]);
    converse(e.m,e.c,'good');

  }
  if(Math.random()<0.65){                                // mostly: swap a fact about a term
    const keys=Object.keys(TERMS), t=keys[Math.random()*keys.length|0];
    const lead=pickPair(["Quiz me — "+t+"?","Quick, what's "+t+"?","Don't forget "+t+".","Refresher: "+t+"."]);
    converse(lead, (RELEVANCE[t]||TERMS[t]), 'combo');

  let p;
  if(patientHP<=45) p=pickPair([{m:"Rough one tonight…",c:"Stay with it, doctor."},{m:"We're slipping behind.",c:"Focus on the next call."}]);

  else p=pickPair([{m:"Quiet moment.",c:"Enjoy it while it lasts."},{m:"How's our patient?",c:"Holding… for now."}]);
  converse(p.m,p.c,'good');
}

function updateHP(delta){

  docMood();

}

function tone(freq,start,dur,type,vol){
  if(!actx||!soundOn)return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type||"square"; o.frequency.value=freq;          /* square = chiptune */
  const t=actx.currentTime+start;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.14,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+0.02);
}

/* ===================== PIXEL CONFETTI ===================== */
const fx=$("#fx"), fxc=fx.getContext("2d");
let parts=[], fxRAF=null;
function fxResize(){ fx.width=innerWidth; fx.height=innerHeight; }
addEventListener("resize",fxResize); fxResize();
function burst(x,y,n,colors,power){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=(Math.random()*(power||6))+2;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,g:0.18,life:1,
      c:colors[i%colors.length],size:(Math.random()*4|0)*2+6,rot:0,vr:0});
  }
  if(!fxRAF) fxLoop();
}
function rain(n){
  const colors=["#ffd45e","#ff3ca6","#2ad4ff","#ff3b3b","#b388ff","#fff"];
  for(let i=0;i<n;i++){
    parts.push({x:Math.random()*fx.width,y:-20,vx:(Math.random()-.5)*2,vy:Math.random()*3+2,g:0.08,life:1.6,
      c:colors[i%colors.length],size:(Math.random()*4|0)*2+6,rot:0,vr:0});
  }
  if(!fxRAF) fxLoop();
}
function fxLoop(){
  fxc.clearRect(0,0,fx.width,fx.height);
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{
    p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.life-=0.012;
    fxc.globalAlpha=Math.max(0,p.life); fxc.fillStyle=p.c;
    fxc.fillRect(Math.round(p.x),Math.round(p.y),p.size,p.size); /* square pixels */
  });
  if(parts.length) fxRAF=requestAnimationFrame(fxLoop); else {fxRAF=null; fxc.clearRect(0,0,fx.width,fx.height);}
}
function floatPop(x,y,text,color){
  const d=document.createElement("div"); d.className="floatpop"; d.textContent=text; d.style.color=color;
  d.style.left=x+"px"; d.style.top=y+"px"; document.body.appendChild(d);
  setTimeout(()=>d.remove(),1000);
}
function wordZoom(text,x,y){   // correct term rushes toward the viewer from the answer's position, fading (one-shot)
  const d=document.createElement("div"); d.className="wordzoom"; d.textContent=text;
  if(x!=null){ d.style.left=x+"px"; d.style.top=y+"px"; }
  document.body.appendChild(d); void d.offsetWidth; d.classList.add("go");
  setTimeout(()=>d.remove(),1100);
}

function multiplierFor(s){ return s>=8?3 : s>=6?2.5 : s>=4?2 : s>=2?1.5 : 1; }

/* ===== adaptive spaced repetition: weight the board toward weak/new terms ===== */
let STATS = (function(){ try{ return JSON.parse(localStorage.getItem("cc_stats")||"{}"); }catch(e){ return {}; } })();
function saveStats(){ try{ localStorage.setItem("cc_stats",JSON.stringify(STATS)); }catch(e){} }
function termWeight(t){ const s=STATS[t]; if(!s||!s.seen) return 6; return s.streak>=3?1 : s.streak>=1?2 : 4; }  // new=6, weak=4, learning=2, mastered=1
function recordStat(t,right){
  const s=STATS[t]||(STATS[t]={seen:0,correct:0,wrong:0,streak:0,last:0});
  s.seen++; if(right){ s.correct++; s.streak++; } else { s.wrong++; s.streak=0; } s.last=Date.now();
  saveStats();
}
function weightedPick(items,n){   // pick n distinct items, biased by termWeight (no replacement)
  const pool=items.slice(), out=[];
  while(out.length<n && pool.length){
    const ws=pool.map(it=>termWeight(it.term)); let total=ws.reduce((a,b)=>a+b,0), r=Math.random()*total, i=0;
    while(i<ws.length-1 && r>ws[i]){ r-=ws[i]; i++; }
    out.push(pool[i]); pool.splice(i,1);
  }
  return out;
}

function renderBoard(){
  const bd=$("#board"); if(!bd) return;
  const cats=Object.keys(BOARD);
  if(!isMobileBoard()){                                  // desktop/tablet: full 6x5 grid
    bd.className="board";
    bd.innerHTML = cats.map(c=>`<div class="cat">${c}</div>`).join("")
      + [0,1,2,3,4].map(r=>cats.map((c,ci)=>{
          const it=BOARD[c][r], bonus=bonusCells.has(ci+"-"+r);
          return `<div class="cell${bonus?' bonus':''}${it.used?' used':''}" data-cat="${c}" data-ci="${ci}" data-r="${r}">${it.p}</div>`;
        }).join("")).join("");
    [...bd.querySelectorAll(".cell")].forEach((c,i)=>{ c.style.animationDelay=(i*18)+"ms"; c.classList.add("in"); c.onclick=()=>quizOpen(c); });
  } else if(mobileCat===null){                            // phone: category select
    bd.className="board mob";
    bd.innerHTML = cats.map((c,ci)=>{
      const left=BOARD[c].filter(it=>!it.used).length;
      return `<div class="mcat${left?'':' done'}" data-cat="${c}"><span>${c}</span><span class="mleft">${left?left+" left":"✓ done"}</span></div>`;
    }).join("");
    [...bd.querySelectorAll(".mcat")].forEach(el=>{ el.onclick=()=>{ if(!el.classList.contains("done")){ mobileCat=el.dataset.cat; renderBoard(); } }; });
  } else {                                                // phone: value select for a category
    const c=mobileCat, ci=cats.indexOf(c);
    bd.className="board mob";
    bd.innerHTML = `<div class="mvtop"><button class="mback" id="mBack">‹ CATEGORIES</button><div class="mvtitle">${c}</div></div>`
      + `<div class="mvals">` + BOARD[c].map((it,r)=>{
          const bonus=bonusCells.has(ci+"-"+r);
          return `<div class="cell${bonus?' bonus':''}${it.used?' used':''}" data-cat="${c}" data-ci="${ci}" data-r="${r}">${it.p}</div>`;

function updateCombo(){
  const m=multiplierFor(streak);
  const tiers=[2,4,6,8]; let lo=0,hi=2;
  for(let i=0;i<tiers.length;i++){ if(streak>=tiers[i]){lo=tiers[i]; hi=tiers[i+1]||tiers[i]+2;} }
  const fill = streak>=8?100 : Math.min(100,((streak-lo)/(hi-lo))*100);
  const f=$("#comboFill"); if(f) f.style.width=fill+"%";
  const ml=$("#multi"); if(ml) ml.textContent="x"+m;
  setAura();
}

function stopTimer(){ if(timerRAF){cancelAnimationFrame(timerRAF); timerRAF=null;} }

function quizOpen(cell){
  if(dead || cell.classList.contains("used"))return;
  document.body.classList.add("playing");   // fade out the backdrop on first question
  stopTimer(); lastActivity=Date.now();
  initAudio(); SFX.click();
  cell.classList.add("flip");
  const item=BOARD[cell.dataset.cat][+cell.dataset.r];
  const isBonus=bonusCells.has(cell.dataset.ci+"-"+cell.dataset.r);
  answered=false;
  const area=$("#qArea");
  if(isBonus){ SFX.bonus(); react('bonus'); setEmo('great'); }
  area.innerHTML=`
    ${isBonus?'<div class="bonusbanner">⚡ STAT BONUS — DOUBLE POINTS! ⚡</div>':''}
    ${timed?'<div class="timerbar"><i id="tbar"></i></div>':''}
    <div class="qtop"><button class="qclose" id="qClose">✕ SKIP — keep this tile</button></div>
    <div class="prompt"><span style="color:var(--quiz);font-family:var(--px);font-size:13px">${cell.dataset.cat} — ${item.p}${isBonus?' ×2':''}</span><br><br>${item.q}</div>
    <div class="choices" id="qChoices"></div>
    <div class="feedback" id="qFb"></div>`;
  area.scrollIntoView({behavior:"auto",block:"nearest"});
  shuffle(item.opts).forEach(o=>{
    const b=document.createElement("button"); b.className="choice"; b.textContent=o;
    b.onclick=()=>quizAnswer(o,b,item,cell,isBonus);
    $("#qChoices").appendChild(b);
  });
  { const bd=$("#board"); if(bd) bd.classList.add("dim"); tuckDocs(true); }   // spotlight the Q&A, bots slide aside
  const qc=$("#qClose"); if(qc) qc.onclick=()=>{   // back out without using the tile
    stopTimer(); qToken++; answered=true;
    cell.classList.remove("flip");
    const bd=$("#board"); if(bd) bd.classList.remove("dim"); tuckDocs(false);
    const a=$("#qArea"); if(a) a.innerHTML="";
  };
  qStart=Date.now();
  if(timed){
    const myToken=++qToken;
    let lastTick=15;
    (function run(){
      if(myToken!==qToken) return;           // a newer question superseded this one
      if(!timed){ const bar=$("#tbar"); if(bar) bar.style.width="100%"; return; }  // timer turned off mid-question
      const elapsed=Date.now()-qStart, left=Math.max(0,QTIME-elapsed);
      const bar=$("#tbar"); if(!bar)return;
      bar.style.width=(left/QTIME*100)+"%";
      const secLeft=Math.ceil(left/1000);
      if(secLeft<=5 && secLeft!==lastTick){ lastTick=secLeft; SFX.tick(); }
      if(left<=0){ if(!answered) quizAnswer(null,null,item,cell,isBonus); return; }
      timerRAF=requestAnimationFrame(run);
    })();
  }
}

  const q=encodeURIComponent(String(t).replace(/\s*\(.*?\)\s*/g," ").trim());
  return `<a class="learnmore" href="https://en.wikipedia.org/wiki/Special:Search?search=${q}" target="_blank" rel="noopener">${label||"🔎 learn more"} ↗</a>`;
}
function optDefs(item){   // definitions of the OTHER options (distractors), as a secondary note
  const others=item.opts.filter(o=>o!==item.a);
  if(!others.length) return "";
  return `<div class="defs"><div class="defslabel">THE OTHER OPTIONS</div>${others.map(o=>`<div class="optdef">• <b>${o}</b> — ${TERMS[o]||''} ${wikiLink(o,"🔎")}</div>`).join("")}</div>`;
}
function quizAnswer(o,b,item,cell,isBonus){
  if(answered)return; answered=true; stopTimer();
  { const bd=$("#board"); if(bd) bd.classList.remove("dim"); tuckDocs(false); }
  $("#qChoices").querySelectorAll(".choice").forEach(x=>x.onclick=null);
  const fb=$("#qFb");
  cell.classList.add("used");
  { const it=BOARD[cell.dataset.cat] && BOARD[cell.dataset.cat][+cell.dataset.r]; if(it) it.used=true; }
  const elapsed=Date.now()-qStart, timedOut=(o===null);
  const isRight=(o===item.a);

  if(isRight){
    b.classList.add("correct");
    streak++; maxStreak=Math.max(maxStreak,streak); correct++;
    recordStat(item.term,true);
    const mult=multiplierFor(streak);
    const speedBonus=timed?Math.round(item.p*0.5*Math.max(0,(QTIME-elapsed)/QTIME)):0;
    let gained=Math.round((item.p+speedBonus)*mult*(isBonus?2:1));
    score+=gained;
    SFX.correct(isBonus?2:mult);
    if(streak>=2 && streak%2===0) SFX.combo(streak);
    const rect=b.getBoundingClientRect();
    const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
    wordZoom(item.term,cx,cy);
    burst(cx,cy,isBonus?40:24,isBonus?["#b388ff","#ffd45e","#fff"]:["#ff3ca6","#ffd45e","#2ad4ff"],isBonus?9:6);
    floatPop(cx-10,cy-10,"+"+gained,isBonus?"#b388ff":"#2ad4ff");
    animateNum($("#qScore"),score);
    $("#qCorrect").textContent=correct;
    react(streak>=4 && streak%2===0 ? 'combo' : 'good');
    healPatient(item.p);
    setEmo(isBonus||streak>=4 ? 'great' : 'good');
    if(streak>0 && streak%5===0) fistBump();
    { const bt=banter({right:true,bonus:isBonus,streak,hp:patientHP,correct}); converse(bt.m,bt.c,bt.cls); }
    const bonusBump=$("#multi"); bonusBump.classList.remove("bump"); void bonusBump.offsetWidth; bonusBump.classList.add("bump");
    fb.className="feedback ok show";
    fb.innerHTML=`✅ <span class="term">${item.term}</span>
      <div class="defmain">${TERMS[item.term]||''}</div>
      <div class="learnrow">${wikiLink(item.term,"🔎 Read more about "+item.term)}</div>
      <span style="color:var(--muted);font-size:17px">+${item.p} base${speedBonus?` · +${speedBonus} speed`:''}${mult>1?` · ×${mult} combo`:''}${isBonus?' · ⚡×2 bonus':''} = <b style="color:var(--gold)">+${gained}</b></span>`;
  }else{
    if(b) b.classList.add("wrong");
    $("#qChoices").querySelectorAll(".choice").forEach(x=>{if(x.textContent===item.a)x.classList.add("correct");});
    missed.push(item.term);
    recordStat(item.term,false);
    streak=0;
    const lost=Math.min(score,item.p);                 // don't drop below zero
    score-=lost;
    animateNum($("#qScore"),score);
    SFX.wrong();
    app.classList.remove("shake"); void app.offsetWidth; app.classList.add("shake");
    if(b){ const r=b.getBoundingClientRect(); floatPop(r.left+r.width/2-12,r.top+r.height/2-10,"-"+item.p,"#ff3b3b"); }
    react('bad'); hurtPatient(item.p);
    setEmo(patientHP<=20 ? 'critical' : 'bad');
    { const bt=banter({right:false,timedOut,hp:patientHP,streak,correct}); converse(bt.m,bt.c,bt.cls); }
    fb.className="feedback no show";
    fb.innerHTML=`${timedOut?'⏱️ <b>OUT OF TIME!</b> ':'❌ '}Correct answer: <b style="color:var(--good)">${item.a}</b>
      <div class="defmain"><span class="term">${item.term}</span> — ${TERMS[item.term]||''}</div>
      <div class="learnrow">${wikiLink(item.term,"🔎 Read more about "+item.term)}</div>
      <span style="color:var(--muted);font-size:17px">−${lost} points · combo reset.</span>`;
  }
  updateCombo();
  cleared++;
  $("#prog").style.width=(cleared/TOTAL*100)+"%";
  if(cleared>=TOTAL){
    fb.innerHTML+=`<div style="margin-top:14px"><button class="btn" onclick="quizSummary()">SEE RESULTS →</button></div>`;
  }
}

function animateNum(el,to){
  const from=parseInt(el.textContent)||0, dur=500, t0=performance.now();
  (function step(t){
    const k=Math.min(1,(t-t0)/dur);
    el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));
    if(k<1) requestAnimationFrame(step);
  })(t0);
}

function rankFor(c){
  if(c>=30) return {t:"🏆 CODE MASTER",col:"var(--gold)"};
  if(c>=27) return {t:"⭐ CHIEF RESIDENT",col:"var(--good)"};
  if(c>=22) return {t:"🩺 ATTENDING",col:"var(--quiz)"};
  if(c>=16) return {t:"💉 RESIDENT",col:"var(--purple)"};
  return {t:"🚑 ROOKIE — KEEP STUDYING",col:"var(--muted)"};
}

  "intramembranous ossification":"Explains how flat bones like the skull and clavicles form without a cartilage stage.",
  "ossification":"The umbrella process behind building and repairing the entire skeleton.",
  "ossification center":"Where bone first starts laying down — the seed of a new bone.",
  "primary ossification center":"The shaft's first bone; the basis for reading bone development on X-rays.",
  "secondary ossification center":"Marks the growing ends of a bone; tied to growth-plate development.",
  "modeling":"Why a child's bones change shape, not just size, as they grow.",
  "remodeling":"The lifelong turnover that heals micro-cracks and keeps blood calcium steady.",
  "osteogenic cell":"The stem cell every osteoblast comes from — the start of bone growth and repair.",
  "osteoid":"The soft scaffold that hardens into bone; central to mineralization and vitamin-D balance.",
  "perichondrium":"Cartilage's wrapper that becomes the bone-building periosteum.",
  "nutrient foramen":"The doorway for a bone's blood supply — no blood, no living bone.",
  "projection":"Surface landmarks where muscles and ligaments grab on; key to naming bone features.",
  "red marrow":"Your blood-cell factory — every red cell, white cell, and platelet starts here.",
  "yellow marrow":"The fatty energy reserve that can switch back to red marrow when blood is needed.",
  "hematopoiesis":"The whole reason marrow matters — it makes your blood.",
  "osteoporosis":"The classic bone-loss disease; understanding remodeling explains why it happens.",
  "proliferative zone":"Where dividing cartilage cells actually make a child's bones longer.",
  "reserve zone":"The anchor that holds the growth plate to the end of the bone.",
  "zone of calcified matrix":"The hand-off point where cartilage becomes bone at the growth plate.",
  "zone of maturation and hypertrophy":"The swelling cartilage cells that drive a bone's increase in length.",
  "notochord":"The embryonic rod that lays out the body axis and triggers the spine to form.",
  "somite":"The segmented blocks that become vertebrae, ribs, muscle, and skin.",
  "sclerotome":"The exact part of a somite that turns into the vertebrae and ribs.",
  "mesenchyme":"The embryonic source tissue for bone, cartilage, blood, and more.",
  "hypercalcemia":"Too much blood calcium — it slows the nervous system down.",
  "hypocalcemia":"Too little blood calcium — nerves and muscles go into overdrive.",
  "calcium homeostasis":"The balance the skeleton helps maintain so nerves, muscles, and clotting work.",
  "calcitriol":"Active vitamin D — the hormone that pulls calcium in from your gut.",
  "growth hormone":"The pituitary signal that makes bones grow longer and thicker.",
  "thyroxine (T4)":"Thyroid hormone that keeps bone-building and metabolism on track.",
  "axial skeleton":"The body's central column — skull, spine, and rib cage — that protects vital organs.",
  "frontal bone":"Your forehead and the roof of your eye sockets.",
  "occipital bone":"The back of the skull, with the hole the spinal cord passes through.",
  "parietal bone":"The paired bones that make up most of the cranial roof.",
  "ethmoid bone":"The delicate bone between the eyes that the smell nerves pass through.",
  "sphenoid bone":"The keystone bone that locks the cranium together and cradles the pituitary.",
  "temporal bone":"Houses your hearing and balance organs and meets the jaw.",
  "maxilla":"The upper jaw that holds your top teeth and forms the front of the palate.",
  "mandible":"The only movable skull bone — your lower jaw for chewing and speaking.",
  "zygomatic bone":"Your cheekbone and part of a major muscle-attachment arch.",
  "palatine bone":"Forms the back of the roof of your mouth.",
  "nasal bone":"The little bones that make the bridge of your nose.",
  "lacrimal bone":"The tiny orbital bone that channels your tears into the nose.",
  "inferior nasal conchae":"Scroll bones that warm and humidify the air you breathe.",
  "vomer":"The bone that forms the bottom of your nasal septum.",
  "cervical":"The seven neck vertebrae that hold up and turn your head.",
  "thoracic":"The twelve vertebrae that anchor your ribs.",
  "lumbar":"The big lower-back vertebrae that carry most of your weight.",
  "sacrum":"The fused wedge of bone that links your spine to your pelvis.",
  "coccyx":"Your tailbone and an anchor for pelvic-floor muscles.",
  "ribs":"The cage that shields your heart and lungs and moves air in and out.",
  "sternum":"The breastbone that the ribs attach to in front."
};
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function culprit(){
  const uniq=[...new Set(missed)]; if(!uniq.length) return null;
  const tally={}; uniq.forEach(t=>{const c=CAT_OF[t]; tally[c]=(tally[c]||0)+1;});
  let topCat=null,topN=0; Object.keys(tally).forEach(c=>{if(tally[c]>topN){topN=tally[c];topCat=c;}});
  let term=null,topP=-1;
  uniq.filter(t=>CAT_OF[t]===topCat).forEach(t=>{ const p=((BOARD[topCat]||[]).find(i=>i.term===t)||{}).p||0; if(p>topP){topP=p;term=t;} });
  return {cat:topCat, domain:DOMAIN[topCat], term, danger:DANGER[term]||("complications from "+DOMAIN[topCat])};
}
function debrief(died){
  const cu=culprit(); let verdict,tone,lineM,lineC;
  if(died){
    tone="critical"; verdict="💀 PATIENT LOST";
    lineM=cu?`We lost them on the table — likely ${cu.danger}.`:"We lost them on the table.";
    lineC=cu?`Hit the books on ${cu.domain} (start with "${cu.term}"). We don't lose the next one.`:"Regroup, doctor — next shift we save them.";
  } else if(correct===TOTAL){
    tone="perfect"; verdict="DISCHARGED — FULL RECOVERY";
    lineM="Patient walked out in perfect health. Flawless shift, Doctor.";
    lineC="Thirty for thirty — the vitals never dipped once. Bravo!";
  } else if(patientHP>=70){
    tone="saved"; verdict="PATIENT SAVED";
    lineM=`Close call with ${cu.danger}, but you pulled them through.`;
    lineC=`Review ${cu.domain} (esp. "${cu.term}") — that's where they nearly slipped.`;
  } else if(patientHP>=40){
    tone="stable"; verdict="PATIENT STABILIZED";
    lineM=`${cap(cu.danger)} set us back hard — guarded, but breathing.`;
    lineC=`Tighten up ${cu.domain} and the next patient walks out the door.`;
  } else {
    tone="critical"; verdict="PATIENT CRITICAL";
    lineM=`Probable cause of the crash: ${cu.danger}.`;
    lineC=`Hit the books on ${cu.domain} (start with "${cu.term}"). Next shift, we save them.`;
  }
  const diagnosis = cu ? cap(cu.danger) : "Patient made a full recovery — no complications.";
  const diagLabel = tone==="perfect" ? "OUTCOME" : tone==="critical" ? "PROBABLE CAUSE OF ARREST" : "CLOSE CALL";
  if(codeBlueHappened && !died && tone!=="perfect") lineM="We coded on the table — "+lineM.charAt(0).toLowerCase()+lineM.slice(1);
  return {verdict,tone,lineM,lineC,diagnosis,diagLabel};
}
function repAvatar(neon){
  const P=8, head=["..NNNN..",".CCCCCC.",".CCCCCC.",".CCCCCC.","..CCCC.."];
  const map={C:'coat',N:'neonfill'}; let s='';
  for(let r=0;r<head.length;r++)for(let c=0;c<head[r].length;c++){const cl=map[head[r][c]];if(cl)s+=`<rect class="${cl}" x="${c*P}" y="${r*P}" width="${P}" height="${P}"/>`;}
  s+=`<rect class="scr" x="${2*P}" y="${2*P}" width="${4*P}" height="${2*P}"/>`;
  s+=`<rect class="visor" x="${2*P+2}" y="${2*P+3}" width="${P-2}" height="${P-2}"/>`;
  s+=`<rect class="visor" x="${4*P}" y="${2*P+3}" width="${P-2}" height="${P-2}"/>`;
  s+=`<rect class="eyeshine" x="${2*P+3}" y="${2*P+4}" width="2" height="2"/>`;
  s+=`<rect class="eyeshine" x="${4*P+1}" y="${2*P+4}" width="2" height="2"/>`;
  return `<span class="repbot" style="--neon:${neon}"><svg viewBox="0 0 ${8*P} ${head.length*P}" class="repface">${s}</svg></span>`;
}

function quizSummary(died){
  stopTimer();
  pendingSubmit={score,correct};                 // offer to submit on the leaderboard screen
  const rank=rankFor(correct);
  const uniqueMissed=[...new Set(missed)];
  const db=debrief(died);
  const goodOutcome = !died && db.tone!=='critical';
  react(goodOutcome?'win':'lose'); setEmo(goodOutcome?'great':'bad');
  if(goodOutcome){ SFX.victory(); if(db.tone==='perfect'||db.tone==='saved') rain(160); victoryDance(); }
  else { SFX.defeat(); }
  const missedHtml = uniqueMissed.length
    ? `<div class="rounds">
         <div class="rounds-head">${repAvatar('#ff3ca6')}${repAvatar('#2ad4ff')}
           <div class="rounds-cap">🩺 TEACHING ROUNDS<br><span>Doc, let's review what slipped — and why it matters on the job:</span></div>
         </div>
         <div class="reviewlist">
           ${uniqueMissed.map(t=>`<div class="review">
              <div class="rev-term">${t}</div>
              <div class="rev-def">${TERMS[t]}</div>
              <div class="rev-why"><b>WHY IT MATTERS</b>${RELEVANCE[t]||''}</div>
           </div>`).join("")}
         </div>
       </div>`
    : `<p style="color:var(--good);margin-top:18px;font-size:22px">🎉 FLAWLESS BOARD — EVERY TERM CORRECT!</p>`;
  main.querySelector(".game").innerHTML=`
    <div class="done-screen">
      <div class="report">
        <div class="rep-title">📟 DOCTOR'S DEBRIEF</div>
        <div class="verdict ${db.tone}">${db.verdict}</div>
        <div class="diagnosis">🔬 ${db.diagLabel}<br><b>${db.diagnosis}</b></div>
        <div class="rep-line" style="animation-delay:.25s">${repAvatar('#ff3ca6')}<div class="rep-bubble m"><b>DR. MAGENTA</b><br>${db.lineM}</div></div>
        <div class="rep-line" style="animation-delay:.5s">${repAvatar('#2ad4ff')}<div class="rep-bubble c"><b>DR. CYAN</b><br>${db.lineC}</div></div>
      </div>
      <div class="rank-badge" style="color:${rank.col}">${rank.t}</div>
      <div class="big" id="finalScore">0</div>
      <div class="donestats">
        <div class="stat">CORRECT <b style="color:var(--good)">${correct}</b>/${TOTAL}</div>
        <div class="stat">PATIENT <b>${patientHP}% HP</b></div>
        <div class="stat">BEST COMBO <b>${maxStreak}🔥</b></div>
        <div class="stat">MAX MULTI <b>x${multiplierFor(maxStreak)}</b></div>
      </div>
      ${missedHtml}
      <div style="margin-top:22px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn" onclick="showLeaderboard()">🏆 ADD TO LEADERBOARD</button>
        <button class="btn ghost" onclick="renderQuiz()">PLAY AGAIN</button>
      </div>
    </div>`;
  animateNum($("#finalScore"),score);
}

/* ===================== LEADERBOARD ===================== */
function esc(s){return String(s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}
function lbReady(){ return LB.url && LB.url.indexOf("YOUR-PROJECT")<0 && LB.anonKey && LB.anonKey.indexOf("YOUR-")<0; }
function lbBlobOn(){ return LB.blob && LB.blob.indexOf("jsonBlob/")>0; }
function lbGlobal(){ return lbReady() || lbBlobOn(); }
function lbHeaders(extra){ return Object.assign({apikey:LB.anonKey,Authorization:"Bearer "+LB.anonKey}, extra||{}); }
function lbLocal(){ try{ return JSON.parse(localStorage.getItem("cc_scores")||"[]"); }catch(e){ return []; } }
function lbSort(a){ return (Array.isArray(a)?a:[]).slice().sort((x,y)=>y.score-x.score); }
async function lbFetch(){
  if(lbReady()){
    try{
      const r=await fetch(`${LB.url}/rest/v1/${LB.table}?select=name,score,correct&order=score.desc&limit=20`,{headers:lbHeaders()});
      if(r.ok) return await r.json();
    }catch(e){}
  } else if(lbBlobOn()){
    try{
      const r=await fetch(LB.blob,{cache:"no-store"});
      if(r.ok) return lbSort(await r.json()).slice(0,20);
    }catch(e){}
  }
  return lbSort(lbLocal()).slice(0,20);
}
async function lbSubmit(name,score,correct){
  name=(name||"ANON").slice(0,16); const entry={name,score,correct}; let remote=false;
  if(lbReady()){
    try{
      const r=await fetch(`${LB.url}/rest/v1/${LB.table}`,{method:"POST",headers:lbHeaders({"Content-Type":"application/json",Prefer:"return=minimal"}),body:JSON.stringify(entry)});
      remote=r.ok;
    }catch(e){}
  } else if(lbBlobOn()){
    try{
      const g=await fetch(LB.blob,{cache:"no-store"}); let a=[]; if(g.ok){ a=await g.json(); if(!Array.isArray(a)) a=[]; }
      a.push(entry); a=lbSort(a).slice(0,100);
      const p=await fetch(LB.blob,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(a)});
      remote=p.ok;
    }catch(e){}
  }
  try{ const la=lbLocal(); la.push(entry); localStorage.setItem("cc_scores",JSON.stringify(lbSort(la).slice(0,50))); }catch(e){}
  return remote;
}
function renderLbList(rows,hiName,hiScore){
  const el=$("#lbList"); if(!el)return;
  if(!rows||!rows.length){ el.innerHTML='<p style="color:var(--muted);text-align:center">No scores yet — be the first!</p>'; return; }
  el.innerHTML=rows.map((r,i)=>{
    const me=(hiName!=null && r.name===hiName && r.score===hiScore);
    return `<div class="lbrow${me?' me':''}"><span class="lbrank">${i+1}</span><span class="lbname">${esc(r.name)}</span><span class="lbscore">${r.score}</span><span class="lbcorrect">${r.correct}/${TOTAL}</span></div>`;
  }).join("");
}
function showLeaderboard(hiName,hiScore){
  stopTimer(); clearDocFx(); restartBtn.classList.remove("hidden");
  const ps=pendingSubmit;
  main.innerHTML=`
    <div class="game">
      <h2>🏆 HIGH SCORES</h2>
      <p class="sub">Top shifts${lbGlobal()?' — everyone who plays':' — local to this device'}.</p>
      ${ps?`<div class="lbentry">
        <div class="lbentry-t">🏁 Your shift: <b>${ps.score} pts</b> · ${ps.correct}/${TOTAL} correct — enter your name to post it:</div>
        <div class="lbsubmit"><input id="lbName" maxlength="16" placeholder="YOUR NAME" autocomplete="off" spellcheck="false"/><button class="btn" id="lbSubmitBtn">SUBMIT</button></div>
      </div>`:''}
      ${(hiName&&!ps)?`<p class="lbdone">✓ Posted as <b>${esc(hiName)}</b>!</p>`:''}
      <div id="lbList" class="lblist">Loading…</div>
      <div style="margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn" onclick="renderQuiz()">▶ PLAY${ps?' (skip)':''}</button>
        <button class="btn ghost" onclick="renderSplash()">‹ MENU</button>
      </div>
    </div>`;
  if(ps){
    const nameIn=$("#lbName"), subBtn=$("#lbSubmitBtn");
    if(nameIn){ try{ nameIn.value=localStorage.getItem("cc_name")||""; }catch(e){} nameIn.focus(); }
    if(subBtn) subBtn.onclick=()=>{
      const nm=((nameIn&&nameIn.value)||"ANON").trim().slice(0,16)||"ANON";
      try{ localStorage.setItem("cc_name",nm); }catch(e){}
      subBtn.disabled=true; subBtn.textContent="SAVING…";
      const sc=ps.score; lbSubmit(nm,sc,ps.correct).then(()=>{ pendingSubmit=null; showLeaderboard(nm,sc); });
    };
  }
  lbFetch().then(rows=>renderLbList(rows,hiName,hiScore));
}

  stopTimer(); pendingSubmit=null; clearDocFx();
  document.body.classList.remove("playing");   // backdrop visible on the splash
  restartBtn.classList.add("hidden");
  main.innerHTML=`
    <div class="splash">
      <div class="splash-bots">${repAvatar('#ff3ca6')}${repAvatar('#2ad4ff')}</div>
      <h1 class="splash-title">CODE QUIZ: STAT!</h1>
      <p class="splash-sub">A retro anatomy study game · Bones &amp; the Axial Skeleton</p>
      <div class="splash-card">
        <p>🩺 Tap tiles on the board and answer the A&amp;P call before the timer runs out.</p>
        <p>🔥 Chain right answers for <b>combo multipliers</b> · ⚡ <b>bonus tiles</b> pay double.</p>
        <p>❤️ Correct answers <b>heal</b> the patient; wrong ones <b>hurt</b> them (more for higher tiles) — <b>if they flatline, it's game over.</b></p>
        <p>🤖 Dr. Magenta &amp; Dr. Cyan quiz you and call the diagnosis at shift's end.</p>
        <p>💬 <b>Watch their banter during play</b> — between calls they drop bone facts, so pausing pays off.</p>
        <p>🧠 The board <b>adapts</b> — terms you miss (or haven't seen) show up more often until you nail them.</p>
        <p style="color:var(--muted)">⏱ Prefer no pressure? Toggle <b>TIMED MODE</b> off any time.</p>
      </div>
      <p class="splash-ask">Ready for your shift, doctor?</p>
      <div class="splash-btns">

  $("#goBtn").onclick=()=>{ initAudio(); setTimeout(()=>SFX.welcome(),120); renderQuiz(); };
}

renderSplash();
</script>
