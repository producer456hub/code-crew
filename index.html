<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Code Quiz: Stat! — 30 Terms for EMT · ECG · Phlebotomy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0518; --panel:#160a1f; --panel2:#22102f;
    --line:#7a3aa0; --text:#fdf7ff; --muted:#d2bee6;
    --phos:#ff3ca6; --quiz:#ff3ca6; --good:#2ad4ff; --bad:#ff3b3b; --gold:#ffd45e; --purple:#b388ff;
    --px:'Press Start 2P','Courier New',monospace;
    --rt:'VT323','Courier New',monospace;
    --bevel: inset -3px -3px 0 0 rgba(0,0,0,.5), inset 3px 3px 0 0 rgba(255,255,255,.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{height:100%;}
  body{margin:0;
    font-family:var(--rt); font-size:23px; letter-spacing:.2px;
    background:var(--bg); background-attachment:fixed;
    color:var(--text); overflow-x:hidden; user-select:none; min-height:100%;
  }
  .choice,.cell,.btn,.iconbtn,.backbtn{touch-action:manipulation;}
  /* CRT overlay */
  #crt{position:fixed;inset:0;pointer-events:none;z-index:60;}
  #crt::before{content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(rgba(255,255,255,.005) 0 2px, rgba(0,0,0,.04) 2px 5px);}
  #crt::after{content:"";position:absolute;inset:0;
    background:radial-gradient(140% 140% at 50% 50%, transparent 70%, rgba(0,0,0,.28) 100%);
    animation:flicker 6s infinite steps(40);}
  @keyframes flicker{0%,100%{opacity:1}48%{opacity:.98}50%{opacity:.96}52%{opacity:.99}}
  #scanbar{position:fixed;left:0;right:0;height:60px;pointer-events:none;z-index:59;
    background:linear-gradient(to bottom, transparent, rgba(255,60,166,.06), transparent);
    animation:scan 7s linear infinite;}
  @keyframes scan{0%{top:-60px}100%{top:100%}}

  #app{min-height:100vh; display:flex; flex-direction:column; transition:transform .05s; position:relative; z-index:2;}
  #app.shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,-3px)}80%{transform:translate(6px,3px)}}

  header{display:flex; align-items:center; gap:14px; padding:12px 18px;
    background:var(--panel); border-bottom:4px solid var(--line); position:sticky; top:0; z-index:5;}
  header .logo{font-family:var(--px); font-size:14px; line-height:1.5; color:var(--phos); display:flex; align-items:center; gap:10px; text-shadow:0 0 8px var(--phos);}
  header .logo .tagline{color:var(--muted);font-size:9px;text-shadow:none;}
  .pulse{color:var(--bad); font-size:18px; text-shadow:0 0 10px var(--bad); animation:beat 1s infinite; display:inline-block;}
  @keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.5)}30%{transform:scale(1)}45%{transform:scale(1.3)}}
  header .spacer{flex:1;}

  .iconbtn,.backbtn,.btn{font-family:var(--px); cursor:pointer; border:none; color:var(--text);
    background:var(--panel2); box-shadow:var(--bevel), 0 4px 0 #0a0418; transition:transform .06s, box-shadow .06s, background .1s;}
  .iconbtn{font-size:14px; padding:10px 12px;}
  .backbtn{font-size:10px; padding:10px 12px; color:var(--phos);}
  .iconbtn:active,.backbtn:active,.btn:active{transform:translateY(4px); box-shadow:var(--bevel);}
  .iconbtn:hover,.backbtn:hover{filter:brightness(1.2);}

  main{flex:1; padding:18px 18px 104px; position:relative; z-index:2;}
  .game{max-width:1040px;margin:0 auto;}
  .game h2{font-family:var(--px); margin:0 0 10px; font-size:18px; color:var(--quiz); text-shadow:0 0 5px var(--quiz); line-height:1.4;}
  .game .sub{color:var(--muted);margin:0 0 16px;font-size:20px;line-height:1.4;}

  /* stats + combo */
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center;}
  .stat{background:var(--panel);box-shadow:var(--bevel);padding:8px 14px;font-size:19px;color:var(--text);border-left:4px solid var(--line);}
  .stat b{font-family:var(--px);font-size:14px;color:var(--gold);text-shadow:0 0 3px var(--gold);}
  .combo{margin-left:auto;display:flex;align-items:center;gap:10px;}
  .combo .lab{color:var(--muted);font-size:17px;}
  .multi{font-family:var(--px);font-size:14px;padding:8px 12px;background:var(--gold);color:#3a2400;box-shadow:var(--bevel);}
  .multi.bump{animation:multibump .5s;}
  @keyframes multibump{0%{transform:scale(1)}40%{transform:scale(1.5);filter:brightness(1.4)}100%{transform:scale(1)}}
  .combobar,.progress,.timerbar{background:#120726;box-shadow:var(--bevel);overflow:hidden;}
  .combobar{width:130px;height:16px;}
  .combobar > i{display:block;height:100%;width:0;transition:width .3s;
    background:repeating-linear-gradient(90deg,var(--gold) 0 8px, #c98a00 8px 10px);}
  .progress{height:16px;margin:0 0 16px;}
  .progress > i{display:block;height:100%;width:0;transition:width .4s steps(20);
    background:repeating-linear-gradient(90deg,var(--quiz) 0 8px, #8a1f5a 8px 10px);}
  .timerbar{height:18px;margin-bottom:14px;}
  .timerbar > i{display:block;height:100%;width:100%;
    background:repeating-linear-gradient(90deg,var(--good) 0 10px, #120726 10px 12px);}

  .prompt{background:var(--panel2);box-shadow:var(--bevel);padding:16px 18px;margin-bottom:14px;font-size:24px;line-height:1.5;border-left:5px solid var(--quiz);}

  .choices{display:grid;gap:12px;}
  .choice{font-family:var(--rt);font-size:24px;line-height:1.3;background:var(--panel2);box-shadow:var(--bevel),0 4px 0 #0a0418;padding:15px 16px;cursor:pointer;text-align:left;color:var(--text);transition:transform .06s,filter .1s;}
  .choice:hover{filter:brightness(1.25);}
  .choice:active{transform:translateY(4px);box-shadow:var(--bevel);}
  .choice.correct{background:#0a2536;color:var(--good);box-shadow:var(--bevel),0 0 16px var(--good);animation:popcorrect .4s;}
  .choice.wrong{background:#3a0c12;color:var(--bad);box-shadow:var(--bevel),0 0 16px var(--bad);animation:nudge .3s;}
  @keyframes popcorrect{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
  @keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .btn{font-size:13px;padding:14px 20px;background:var(--quiz);color:#02232b;}
  .btn:hover{filter:brightness(1.15);}
  .btn.ghost{background:var(--panel2);color:var(--text);}

  .feedback{margin-top:14px;padding:14px 16px;font-size:21px;line-height:1.55;display:none;box-shadow:var(--bevel);}
  .feedback.show{display:block;animation:fadeup .3s;}
  @keyframes fadeup{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .feedback.ok{background:#0a2230;border-left:5px solid var(--good);}
  .feedback.no{background:#2c0a10;border-left:5px solid var(--bad);}
  .feedback .term{font-family:var(--px);font-size:13px;color:var(--gold);text-shadow:0 0 2px var(--gold);}

  /* board */
  .board{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
  .cat{font-family:var(--rt);font-weight:bold;background:var(--panel);color:var(--phos);box-shadow:var(--bevel);padding:8px 4px;text-align:center;font-size:18px;line-height:1.1;min-height:48px;display:flex;align-items:center;justify-content:center;text-shadow:0 0 2px var(--phos);}
  .cell{position:relative;font-family:var(--px);background:#2b1240;box-shadow:var(--bevel),0 4px 0 #0a0418;padding:18px 4px;text-align:center;font-size:16px;color:var(--gold);cursor:pointer;transition:transform .1s,filter .1s;opacity:0;transform:scale(.5);text-shadow:none;}
  .cell.in{animation:cellin .4s forwards;}
  @keyframes cellin{to{opacity:1;transform:scale(1);}}
  .cell:hover{filter:brightness(1.3);}
  .cell:active{transform:translateY(4px);box-shadow:var(--bevel);}
  .cell.bonus{background:#5a1577;color:#fff;box-shadow:var(--bevel),0 4px 0 #0a0418,0 0 16px var(--purple);}
  .cell.bonus::after{content:"⚡";position:absolute;top:2px;right:5px;font-size:12px;}
  .cell.flip{animation:flip .35s;}
  @keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(90deg) scale(1.1)}100%{transform:rotateY(0)}}
  .cell.used{background:#1a0e26;color:var(--muted);cursor:default;filter:none;opacity:.35;box-shadow:var(--bevel);text-shadow:none;}
  .cell.used:hover{transform:none;filter:none;}

  .bonusbanner{font-family:var(--px);text-align:center;font-size:16px;color:var(--purple);margin-bottom:12px;animation:bonusflash .8s;text-shadow:0 0 18px var(--purple);}
  @keyframes bonusflash{0%{transform:scale(.4);opacity:0}40%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:1}}

  /* results */
  .done-screen{text-align:center;padding:14px;}
  .rank-badge{font-family:var(--px);font-size:22px;margin:10px 0;line-height:1.5;animation:badgein .7s cubic-bezier(.2,1.3,.4,1);}
  @keyframes badgein{0%{transform:scale(0) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
  .done-screen .big{font-family:var(--px);font-size:40px;color:var(--gold);text-shadow:0 0 24px var(--gold);margin:8px 0;}
  .donestats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0;}
  .reviewlist{text-align:left;max-width:620px;margin:0 auto;display:grid;gap:10px;}
  .rounds{margin-top:22px;}
  .rounds-head{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:16px;flex-wrap:wrap;}
  .rounds-cap{font-family:var(--px);font-size:12px;color:var(--muted);text-align:left;line-height:1.6;max-width:380px;}
  .rounds-cap span{font-family:var(--rt);font-size:18px;color:var(--text);}
  .review{background:var(--panel2);box-shadow:var(--bevel);padding:12px 14px;margin-bottom:10px;text-align:left;}
  .rev-term{font-family:var(--px);font-size:14px;color:var(--gold);text-shadow:0 0 4px var(--gold);}
  .rev-def{font-size:20px;color:var(--text);margin:8px 0 7px;line-height:1.4;}
  .rev-why{font-size:19px;color:var(--good);line-height:1.5;}
  .rev-why b{font-family:var(--px);font-size:9px;color:var(--quiz);margin-right:8px;letter-spacing:.5px;}
  .report{background:var(--panel2);box-shadow:var(--bevel),0 0 24px rgba(255,212,94,.22);padding:18px;margin:0 auto 22px;max-width:680px;text-align:left;animation:reportin .55s cubic-bezier(.2,1.2,.4,1);}
  @keyframes reportin{0%{opacity:0;transform:scale(.85) translateY(24px)}100%{opacity:1;transform:none}}
  .rep-title{font-family:var(--px);font-size:12px;color:var(--muted);margin-bottom:14px;letter-spacing:2px;text-align:center;}
  .verdict{font-family:var(--px);font-size:24px;line-height:1.4;text-align:center;padding:16px;margin-bottom:12px;box-shadow:var(--bevel);animation:verdpulse 1.5s ease-in-out infinite;}
  @keyframes verdpulse{0%,100%{filter:drop-shadow(0 0 3px currentColor)}50%{filter:drop-shadow(0 0 18px currentColor)}}
  .verdict.perfect,.verdict.saved{color:var(--good);}
  .verdict.stable{color:var(--gold);}
  .verdict.critical{color:var(--bad);}
  .diagnosis{font-family:var(--rt);font-size:22px;text-align:center;background:#0c0518;box-shadow:var(--bevel);padding:13px 14px;margin-bottom:16px;line-height:1.4;color:var(--muted);}
  .diagnosis b{display:inline-block;margin-top:6px;font-family:var(--px);font-size:15px;line-height:1.7;color:var(--gold);text-shadow:0 0 8px var(--gold);}
  .rep-line{display:flex;gap:12px;align-items:center;margin-bottom:12px;opacity:0;animation:repline .5s ease forwards;}
  @keyframes repline{0%{opacity:0;transform:translateX(-14px)}100%{opacity:1;transform:none}}
  .repbot{flex:0 0 auto;}
  .repface{width:58px;height:auto;display:block;image-rendering:pixelated;filter:drop-shadow(0 0 3px var(--neon));}
  .rep-bubble{background:var(--panel);box-shadow:var(--bevel);padding:11px 13px;font-size:20px;line-height:1.35;flex:1;}
  .rep-bubble b{font-family:var(--px);font-size:11px;}
  .rep-bubble.m b{color:#ff3ca6;} .rep-bubble.c b{color:#2ad4ff;}

  .floatpop{position:fixed;pointer-events:none;font-family:var(--px);font-size:18px;z-index:50;text-shadow:0 0 10px currentColor;animation:floatup 1s forwards;}
  @keyframes floatup{0%{transform:translateY(0) scale(.6);opacity:0}20%{transform:translateY(-8px) scale(1.1);opacity:1}100%{transform:translateY(-70px) scale(1);opacity:0}}

  /* ===== cyberpunk medics ===== */
  .doc{position:fixed;bottom:30px;width:150px;z-index:3;pointer-events:none;--neon:#ff3ca6;animation:docbob 3.4s ease-in-out infinite;}
  .doc.left{left:12px;}
  .doc.right{right:12px;--neon:#2ad4ff;animation-delay:.7s;}
  .doc.right .docsvg{transform:scaleX(-1);}
  .docsvg{width:100%;height:auto;display:block;filter:drop-shadow(0 0 3px var(--neon));}
  .emo{position:absolute;top:-12px;left:50%;font-size:32px;opacity:0;pointer-events:none;line-height:1;filter:drop-shadow(0 0 4px rgba(0,0,0,.5));}
  .emo.show{animation:emopop 1.2s ease;}
  @keyframes emopop{0%{opacity:0;transform:translate(-50%,8px) scale(.3)}18%{opacity:1;transform:translate(-50%,-4px) scale(1.3)}70%{opacity:1;transform:translate(-50%,-16px) scale(1)}100%{opacity:0;transform:translate(-50%,-34px) scale(1)}}
  .coat{fill:#eaf0ff;} .metal{fill:#241d38;} .mask{fill:#3a2f57;} .glove{fill:#2a2440;}
  .ol{stroke:var(--neon);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;}
  .nofill{fill:none;}
  .neonfill,.visor,.emblem{fill:var(--neon);}
  .led{fill:var(--gold);animation:vled 1.2s infinite;}
  .seam,.vent,.steth{opacity:.7;}
  .joint{fill:#e4e8f2;stroke:#aeb6c8;stroke-width:1.5;}
  .arm{fill:none;stroke:#cfd5e2;stroke-width:5;stroke-linecap:round;}
  .spring{fill:none;stroke:#aeb6c8;stroke-width:2.5;}
  .gloss{fill:rgba(255,255,255,.4);}
  .cross{fill:#ff3b3b;}
  .pixg{fill:#cfd5e2;}
  .mp{fill:#20142e;}
  .scr{fill:#141021;}
  .clip{fill:#caa24a;}
  .eyeshine{fill:#ffffff;}
  .blush{fill:#ff8fb0;opacity:.9;}
  .mo{display:none;}
  .sweat{fill:#7fd4ff;display:none;transform-box:fill-box;transform-origin:center;}
  .armR{transform-box:fill-box;transform-origin:80% 0;transition:transform .25s ease;}
  .visor{transform-box:fill-box;transform-origin:center;animation:vblink 4s infinite;}
  .doc.right .visor{animation-delay:1.3s;}
  .emblem{animation:empulse 1.6s infinite;}
  @keyframes docbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes vblink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
  @keyframes vled{0%,100%{opacity:1}50%{opacity:.2}}
  @keyframes empulse{0%,100%{opacity:.75}50%{opacity:1}}
  /* mood reflects the patient's health */
  .doc.mood-happy{animation:dochappy 2.4s ease-in-out infinite;}
  .doc.mood-ok{animation:docbob 3.4s ease-in-out infinite;}
  .doc.mood-worried{animation:docworry 1.3s ease-in-out infinite;}
  .doc.mood-critical{animation:docpanic .5s ease-in-out infinite;}
  @keyframes dochappy{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @keyframes docworry{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-3px) rotate(1.5deg)}}
  @keyframes docpanic{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
  .doc.mood-worried .visor{fill:var(--gold);}
  .doc.mood-critical .visor{fill:var(--bad);animation:eyepanic .6s infinite;}
  @keyframes eyepanic{0%,100%{opacity:1}50%{opacity:.4}}
  .doc.mood-happy .mo-happy,.doc.mood-ok .mo-ok,.doc.mood-worried .mo-worried,.doc.mood-critical .mo-crit{display:block;}
  .doc.mood-worried .sweat,.doc.mood-critical .sweat{display:block;animation:drip 1.7s infinite;}
  @keyframes drip{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(11px);opacity:0}}

  .doc.react-good{animation:dochop .5s 2;}
  .doc.react-combo{animation:dochop .42s 3;}
  .doc.react-bonus{animation:dochop .36s 4;}
  .doc.react-win{animation:dochop .5s 6;}
  .doc.react-bad{animation:docshake .4s 2;}
  @keyframes dochop{0%{transform:translateY(0)}30%{transform:translateY(-18px)}60%{transform:translateY(0)}}
  @keyframes docshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  .doc.react-good .armR,.doc.react-combo .armR,.doc.react-bonus .armR,.doc.react-win .armR{transform:rotate(-52deg);}
  .doc.react-good .visor{fill:#fff;}
  .doc.react-combo .visor,.doc.react-bonus .visor,.doc.react-win .visor{fill:var(--gold);}
  .doc.react-bad .visor{fill:var(--bad);}
  .doc.react-good .docsvg{filter:drop-shadow(0 0 9px #fff);}
  .doc.react-bad .docsvg{filter:drop-shadow(0 0 7px var(--bad));}
  .doc.react-combo .docsvg,.doc.react-bonus .docsvg,.doc.react-win .docsvg{filter:drop-shadow(0 0 9px var(--gold));}
  .bubble{position:fixed;z-index:7;bottom:300px;font-family:var(--rt);font-size:18px;line-height:1.3;padding:9px 11px;max-width:210px;text-align:center;background:var(--panel2);color:var(--text);box-shadow:var(--bevel),0 4px 0 #0a0418;opacity:0;pointer-events:none;transition:opacity .35s;}
  .bubbleL{left:18px;} .bubbleR{right:18px;}
  .bubble.show{opacity:1;animation:bubin .3s;}
  @keyframes bubin{0%{opacity:0;transform:translateY(10px) scale(.7)}100%{opacity:1;transform:none}}
  .bubble.good{color:var(--good);} .bubble.bad{color:var(--bad);}
  .bubble.combo,.bubble.bonus{color:var(--gold);} .bubble.win,.bubble.lose{color:var(--purple);}
  /* ---- responsive: tablets & phones ---- */
  @media(max-width:1240px){
    .bubble{display:none;}                 /* no room for bubbles; the ticker shows the banter */
    #ticker{display:block;}
    .emo{font-size:24px;top:-8px;}
    .doc{width:88px;bottom:6px;}
    .doc.left{left:4px;} .doc.right{right:4px;}
    #patient{bottom:8px;}
    main{padding-bottom:200px;}
  }
  @media(max-width:600px){
    body{font-size:18px;letter-spacing:0;}
    header{padding:8px 10px;}
    header .logo{font-size:11px;gap:6px;}
    header .tagline{display:none;}
    .iconbtn,.backbtn{font-size:9px;padding:8px;}
    main{padding:12px 10px 188px;}
    #ticker{font-size:14px;bottom:92px;padding:7px 10px;}
    .game h2{font-size:13px;}
    .game .sub{font-size:15px;}
    .stat{font-size:14px;padding:5px 8px;} .stat b{font-size:11px;}
    .combo{margin-left:0;width:100%;justify-content:flex-start;}
    .combobar{width:90px;}
    .board{gap:4px;}
    .cat{font-size:10px;min-height:34px;padding:4px 1px;line-height:1.05;}
    .cell{font-size:13px;padding:12px 1px;}
    .prompt{font-size:17px;padding:12px;}
    .choice{font-size:17px;padding:12px;}
    .feedback{font-size:16px;}
    .doc{width:54px;}
    .doc.left{left:2px;} .doc.right{right:2px;}
    #patient{gap:8px;padding:6px 8px;}
    .pscreen{width:44px;height:44px;}
    .pface{width:40px;height:40px;}
    .phpbar{width:92px;}
    .plabel{font-size:8px;margin-bottom:3px;} .pstatus{font-size:9px;margin-top:3px;}
    .verdict{font-size:16px;padding:12px;}
    .diagnosis{font-size:18px;} .diagnosis b{font-size:12px;}
    .rep-bubble{font-size:16px;padding:9px 10px;} .rep-bubble b{font-size:10px;}
    .repface{width:46px;}
    .rep-title{font-size:10px;}
    .done-screen .big{font-size:30px;}
    .rank-badge{font-size:15px;}
  }

  /* ===== patient ===== */
  #patient{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:6;pointer-events:none;display:flex;align-items:center;gap:12px;background:var(--panel);box-shadow:var(--bevel),0 4px 0 #0a0418;padding:8px 14px;border-top:3px solid var(--line);}
  #patient.codeblue{animation:cbflash .5s infinite;}
  @keyframes cbflash{0%,100%{filter:none}50%{filter:drop-shadow(0 0 14px var(--bad));}}
  .pscreen{width:58px;height:58px;background:#0c0518;box-shadow:var(--bevel);display:flex;align-items:center;justify-content:center;}
  .pface{width:54px;height:54px;display:block;}
  .phead{fill:#f2c79c;stroke:#20142e;stroke-width:2;}
  .phair{fill:#3a2f57;}
  .e-n{fill:#20142e;}

function converse(m,c,cls){
  lastActivity=Date.now();
  bubble("L",m,cls); tick("M",m);                      // Dr. Magenta speaks
  clearTimeout(cvT); cvT=setTimeout(()=>{ bubble("R",c,cls); tick("C",c); },850);  // Dr. Cyan replies
}
function pickPair(a){return a[Math.random()*a.length|0];}
function banter(ctx){
  if(ctx.timedOut) return Object.assign({cls:'bad'},pickPair([
    {m:"Too slow — missed the window!",c:"Watch the clock, doctor."},
    {m:"Time's up on that one!",c:"Quicker on the next call."}]));
  if(!ctx.right){
    if(ctx.hp<=20) return Object.assign({cls:'bad'},pickPair([
      {m:"They're CRASHING!",c:"We can't lose another one!"},
      {m:"Flatline warning!",c:"Pull it together, doctor!"}]));
    if(ctx.hp<=45) return Object.assign({cls:'bad'},pickPair([
      {m:"Wrong call — vitals dipping.",c:"Shake it off, refocus."},
      {m:"That one hurt the patient.",c:"Read the chart next time."}]));
    return Object.assign({cls:'bad'},pickPair([
      {m:"Oof, not quite.",c:"Happens — stay sharp."},
      {m:"That's not the one.",c:"We'll get the next."}]));
  }
  if(ctx.bonus) return Object.assign({cls:'bonus'},pickPair([
    {m:"Bonus nailed — double points!",c:"Now THAT'S a doctor!"},
    {m:"Jackpot tile, clean hit!",c:"Show-off."}]));
  if(ctx.streak>=6) return Object.assign({cls:'combo'},pickPair([
    {m:"They're UNSTOPPABLE!",c:ctx.streak+" straight — record pace!"},
    {m:"Can't miss today!",c:"Best run all shift!"}]));
  if(ctx.streak>=3) return Object.assign({cls:'combo'},pickPair([
    {m:"Another clean call!",c:"That's "+ctx.streak+" in a row!"},
    {m:"On a roll!",c:"Keep that combo alive!"}]));
  if(ctx.hp>=90) return Object.assign({cls:'good'},pickPair([
    {m:"Patient's thriving.",c:"Textbook work, doctor."},
    {m:"Vitals look perfect.",c:"Nice and steady."}]));
  return Object.assign({cls:'good'},pickPair([
    {m:"Good call.",c:"Vitals holding."},
    {m:"Correct — nice.",c:"Onward, doctor."}]));
}
function idleBanter(){
  if(Math.random()<0.65){                                // mostly: swap a fact about a term
    const keys=Object.keys(TERMS), t=keys[Math.random()*keys.length|0];
    const lead=pickPair(["Quiz me — "+t+"?","Quick, what's "+t+"?","Don't forget "+t+".","Refresher: "+t+"."]);
    converse(lead, (RELEVANCE[t]||TERMS[t]), 'combo');
    return;
  }
  let p;
  if(patientHP<=45) p=pickPair([{m:"Rough one tonight…",c:"Stay with it, doctor."},{m:"We're slipping behind.",c:"Focus on the next call."}]);
  else if(cleared>=4 && correct>=cleared*0.8) p=pickPair([{m:"This one's good.",c:"Best shift in weeks."},{m:"Smooth so far.",c:"Don't jinx it."}]);
  else p=pickPair([{m:"Quiet moment.",c:"Enjoy it while it lasts."},{m:"How's our patient?",c:"Holding… for now."}]);
  converse(p.m,p.c,'good');
}
setInterval(()=>{                                       // ambient chatter when the player pauses
  if(!document.getElementById('board')) return;         // only during an active board
  if(Date.now()-lastActivity < 16000) return;
  idleBanter();
},5000);
function vflash(color){ const v=$("#vflash"); if(!v)return; v.style.background=color; v.classList.remove("go"); void v.offsetWidth; v.classList.add("go"); }
let patientHP=100, codeBlueHappened=false;
function refreshStatus(){ const st=$("#pStatus"); if(!st)return; let t,c;
  if(patientHP<=0){t="FLATLINE";c="var(--bad)";} else if(patientHP>60){t="STABLE";c="var(--good)";}
  else if(patientHP>30){t="GUARDED";c="var(--gold)";} else {t="CRITICAL";c="var(--bad)";}
  st.textContent=t; st.style.color=c;
}
function docMood(){
  const m = patientHP>75?'happy' : patientHP>45?'ok' : patientHP>20?'worried' : 'critical';
  [$("#docL"),$("#docR")].forEach(d=>{ if(!d)return;
    d.classList.remove('mood-happy','mood-ok','mood-worried','mood-critical');
    d.classList.add('mood-'+m);
  });
}
function updateHP(delta){
  patientHP=Math.max(0,Math.min(100,patientHP+delta));
  const f=$("#phpFill"); if(f){ f.style.width=patientHP+"%"; f.style.background=patientHP>60?"var(--good)":patientHP>30?"var(--gold)":"var(--bad)"; }
  docMood();
  if(patientHP<=0 && delta<0) codeBlue(); else refreshStatus();
}
function codeBlue(){ const p=$("#patient"), st=$("#pStatus");
  codeBlueHappened=true;
  if(st){st.textContent="CODE BLUE!";st.style.color="var(--bad)";}
  if(p)p.classList.add("codeblue");
  vflash("rgba(255,59,59,1)");
  setTimeout(()=>{ if(p)p.classList.remove("codeblue"); patientHP=45; updateHP(0); },1100);
}
function patientPulse(kind,amt){
  const p=$("#patient"); if(!p)return;
  p.classList.remove("heal","hurt"); void p.offsetWidth; p.classList.add(kind);
  clearTimeout(p._pt); p._pt=setTimeout(()=>{ p.classList.remove(kind); refreshStatus(); },1100);
  const r=p.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+8;
  const st=$("#pStatus");
  if(kind==="heal"){ burst(cx,cy,16,["#2ad4ff","#b9ffe9","#fff"],5); floatPop(cx-30,cy-12,"+"+amt+" HP","#2ad4ff"); if(st){st.textContent="+ HEALED";st.style.color="var(--good)";} }
  else { burst(cx,cy,18,["#ff3b3b","#ffd45e","#fff"],6); floatPop(cx-30,cy-12,"-"+amt+" HP","#ff3b3b"); vflash("rgba(255,59,59,1)"); if(st){st.textContent="OUCH!";st.style.color="var(--bad)";} }
}
/* patient effect scales with the tile's point value: high-value tiles heal more, and hurt far more when wrong */
function healPatient(p){ const amt=Math.round(p/100)+2; updateHP(amt); patientPulse("heal",amt); }
function hurtPatient(p){ const amt=Math.round(p/30); updateHP(-amt); patientPulse("hurt",amt); }

function initAudio(){ if(!actx){ try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } if(actx&&actx.state==="suspended") actx.resume(); }
function tone(freq,start,dur,type,vol){
  if(!actx||!soundOn)return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type||"square"; o.frequency.value=freq;          /* square = chiptune */
  const t=actx.currentTime+start;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.14,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+0.02);
}

  wrong(){ tone(200,0,0.12,"sawtooth",0.14); tone(150,0.1,0.18,"sawtooth",0.14); tone(90,0.2,0.22,"square",0.12); },
  combo(n){ tone(700+n*90,0,0.08,"square",0.12); tone(1050+n*90,0.05,0.1,"square",0.1); },
  bonus(){ [392,523,659,784,1047,1319].forEach((f,i)=>tone(f,i*0.04,0.14,"square",0.12)); },
  tick(){ tone(960,0,0.03,"square",0.06); },

};

/* ===================== PIXEL CONFETTI ===================== */
const fx=$("#fx"), fxc=fx.getContext("2d");
let parts=[], fxRAF=null;
function fxResize(){ fx.width=innerWidth; fx.height=innerHeight; }
addEventListener("resize",fxResize); fxResize();
function burst(x,y,n,colors,power){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=(Math.random()*(power||6))+2;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,g:0.18,life:1,
      c:colors[i%colors.length],size:(Math.random()*4|0)*2+6,rot:0,vr:0});
  }
  if(!fxRAF) fxLoop();
}
function rain(n){
  const colors=["#ffd45e","#ff3ca6","#2ad4ff","#ff3b3b","#b388ff","#fff"];
  for(let i=0;i<n;i++){
    parts.push({x:Math.random()*fx.width,y:-20,vx:(Math.random()-.5)*2,vy:Math.random()*3+2,g:0.08,life:1.6,
      c:colors[i%colors.length],size:(Math.random()*4|0)*2+6,rot:0,vr:0});
  }
  if(!fxRAF) fxLoop();
}
function fxLoop(){
  fxc.clearRect(0,0,fx.width,fx.height);
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{
    p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.life-=0.012;
    fxc.globalAlpha=Math.max(0,p.life); fxc.fillStyle=p.c;
    fxc.fillRect(Math.round(p.x),Math.round(p.y),p.size,p.size); /* square pixels */
  });
  if(parts.length) fxRAF=requestAnimationFrame(fxLoop); else {fxRAF=null; fxc.clearRect(0,0,fx.width,fx.height);}
}
function floatPop(x,y,text,color){
  const d=document.createElement("div"); d.className="floatpop"; d.textContent=text; d.style.color=color;
  d.style.left=x+"px"; d.style.top=y+"px"; document.body.appendChild(d);
  setTimeout(()=>d.remove(),1000);
}

let score=0, cleared=0, correct=0, missed=[], streak=0, maxStreak=0, bonusCells=new Set(), BOARD={};
let timerRAF=null, qStart=0, answered=false, qToken=0;

function multiplierFor(s){ return s>=8?3 : s>=6?2.5 : s>=4?2 : s>=2?1.5 : 1; }

function renderQuiz(){
  stopTimer();
  restartBtn.classList.remove("hidden");
  score=0; cleared=0; correct=0; missed=[]; streak=0; maxStreak=0;
  patientHP=100; codeBlueHappened=false; updateHP(0);
  const cats=Object.keys(QUIZ);
  BOARD={}; cats.forEach(c=>{ BOARD[c]=shuffle(QUIZ[c]).slice(0,5).map((it,i)=>({p:(i+1)*100,q:it.q,a:it.a,opts:it.opts})); });
  bonusCells=new Set(); const all=[]; cats.forEach((c,ci)=>[0,1,2,3,4].forEach(r=>all.push(ci+"-"+r)));
  shuffle(all).slice(0,2).forEach(k=>bonusCells.add(k));
  main.innerHTML=`
    <div class="game">
      <h2>📋 CODE QUIZ: STAT!</h2>
      <p class="sub">Pick a value, stack combos, keep the patient alive. ⚡ tiles pay double · ⏱ toggles the timer.</p>
      <div class="stats">
        <div class="stat">SCORE <b id="qScore">0</b></div>
        <div class="stat">CORRECT <b id="qCorrect">0</b>/${TOTAL}</div>
        <div class="combo">
          <span class="lab">COMBO</span>
          <div class="combobar"><i id="comboFill"></i></div>
          <span class="multi" id="multi">x1</span>
        </div>
      </div>

        ${cats.map(c=>`<div class="cat">${c}</div>`).join("")}
        ${[0,1,2,3,4].map(r=>cats.map((c,ci)=>{
          const bonus=bonusCells.has(ci+"-"+r);
          return `<div class="cell${bonus?' bonus':''}" data-cat="${c}" data-ci="${ci}" data-r="${r}">${BOARD[c][r].p}</div>`;
        }).join("")).join("")}
      </div>
      <div id="qArea" style="margin-top:16px"></div>
    </div>`;
  const cells=[...main.querySelectorAll(".cell")];
  cells.forEach((c,i)=>{ c.style.animationDelay=(i*18)+"ms"; c.classList.add("in"); c.onclick=()=>quizOpen(c); });
  updateCombo();

function updateCombo(){
  const m=multiplierFor(streak);
  const tiers=[2,4,6,8]; let lo=0,hi=2;
  for(let i=0;i<tiers.length;i++){ if(streak>=tiers[i]){lo=tiers[i]; hi=tiers[i+1]||tiers[i]+2;} }
  const fill = streak>=8?100 : Math.min(100,((streak-lo)/(hi-lo))*100);
  const f=$("#comboFill"); if(f) f.style.width=fill+"%";
  const ml=$("#multi"); if(ml) ml.textContent="x"+m;
}

function stopTimer(){ if(timerRAF){cancelAnimationFrame(timerRAF); timerRAF=null;} }

function quizOpen(cell){
  if(cell.classList.contains("used"))return;
  stopTimer(); lastActivity=Date.now();
  initAudio(); SFX.click();
  cell.classList.add("flip");
  const item=BOARD[cell.dataset.cat][+cell.dataset.r];
  const isBonus=bonusCells.has(cell.dataset.ci+"-"+cell.dataset.r);
  answered=false;
  const area=$("#qArea");
  if(isBonus){ SFX.bonus(); react('bonus'); setEmo('great'); }
  area.innerHTML=`
    ${isBonus?'<div class="bonusbanner">⚡ STAT BONUS — DOUBLE POINTS! ⚡</div>':''}
    ${timed?'<div class="timerbar"><i id="tbar"></i></div>':''}
    <div class="prompt"><span style="color:var(--quiz);font-family:var(--px);font-size:13px">${cell.dataset.cat} — ${item.p}${isBonus?' ×2':''}</span><br><br>${item.q}</div>
    <div class="choices" id="qChoices"></div>
    <div class="feedback" id="qFb"></div>`;
  area.scrollIntoView({behavior:"auto",block:"nearest"});
  shuffle(item.opts).forEach(o=>{
    const b=document.createElement("button"); b.className="choice"; b.textContent=o;
    b.onclick=()=>quizAnswer(o,b,item,cell,isBonus);
    $("#qChoices").appendChild(b);
  });
  qStart=Date.now();
  if(timed){
    const myToken=++qToken;
    let lastTick=15;
    (function run(){
      if(myToken!==qToken) return;           // a newer question superseded this one
      if(!timed){ const bar=$("#tbar"); if(bar) bar.style.width="100%"; return; }  // timer turned off mid-question
      const elapsed=Date.now()-qStart, left=Math.max(0,QTIME-elapsed);
      const bar=$("#tbar"); if(!bar)return;
      bar.style.width=(left/QTIME*100)+"%";
      const secLeft=Math.ceil(left/1000);
      if(secLeft<=5 && secLeft!==lastTick){ lastTick=secLeft; SFX.tick(); }
      if(left<=0){ if(!answered) quizAnswer(null,null,item,cell,isBonus); return; }
      timerRAF=requestAnimationFrame(run);
    })();
  }
}

function quizAnswer(o,b,item,cell,isBonus){
  if(answered)return; answered=true; stopTimer();
  $("#qChoices").querySelectorAll(".choice").forEach(x=>x.onclick=null);
  const fb=$("#qFb");
  cell.classList.add("used");
  const elapsed=Date.now()-qStart, timedOut=(o===null);
  const isRight=(o===item.a);

  if(isRight){
    b.classList.add("correct");
    streak++; maxStreak=Math.max(maxStreak,streak); correct++;
    const mult=multiplierFor(streak);
    const speedBonus=timed?Math.round(item.p*0.5*Math.max(0,(QTIME-elapsed)/QTIME)):0;
    let gained=Math.round((item.p+speedBonus)*mult*(isBonus?2:1));
    score+=gained;
    SFX.correct(isBonus?2:mult);
    if(streak>=2 && streak%2===0) SFX.combo(streak);
    const rect=b.getBoundingClientRect();
    const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
    burst(cx,cy,isBonus?40:24,isBonus?["#b388ff","#ffd45e","#fff"]:["#ff3ca6","#ffd45e","#2ad4ff"],isBonus?9:6);
    floatPop(cx-10,cy-10,"+"+gained,isBonus?"#b388ff":"#2ad4ff");
    animateNum($("#qScore"),score);
    $("#qCorrect").textContent=correct;
    react(streak>=4 && streak%2===0 ? 'combo' : 'good');
    healPatient(item.p);
    setEmo(isBonus||streak>=4 ? 'great' : 'good');
    { const bt=banter({right:true,bonus:isBonus,streak,hp:patientHP,correct}); converse(bt.m,bt.c,bt.cls); }
    const bonusBump=$("#multi"); bonusBump.classList.remove("bump"); void bonusBump.offsetWidth; bonusBump.classList.add("bump");
    fb.className="feedback ok show";
    fb.innerHTML=`✅ <span class="term">${item.a}</span> — ${TERMS[item.a]||''}<br>
      <span style="color:var(--muted);font-size:17px">+${item.p} base${speedBonus?` · +${speedBonus} speed`:''}${mult>1?` · ×${mult} combo`:''}${isBonus?' · ⚡×2 bonus':''} = <b style="color:var(--gold)">+${gained}</b></span>`;
  }else{
    if(b) b.classList.add("wrong");
    $("#qChoices").querySelectorAll(".choice").forEach(x=>{if(x.textContent===item.a)x.classList.add("correct");});
    missed.push(item.a);
    streak=0;
    const lost=Math.min(score,item.p);                 // don't drop below zero
    score-=lost;
    animateNum($("#qScore"),score);
    SFX.wrong();
    app.classList.remove("shake"); void app.offsetWidth; app.classList.add("shake");
    if(b){ const r=b.getBoundingClientRect(); floatPop(r.left+r.width/2-12,r.top+r.height/2-10,"-"+item.p,"#ff3b3b"); }
    react('bad'); hurtPatient(item.p);
    setEmo(patientHP<=20 ? 'critical' : 'bad');
    { const bt=banter({right:false,timedOut,hp:patientHP,streak,correct}); converse(bt.m,bt.c,bt.cls); }
    fb.className="feedback no show";
    fb.innerHTML=`${timedOut?'⏱️ <b>OUT OF TIME!</b> ':'❌ '}Answer: <span class="term">${item.a}</span> — ${TERMS[item.a]||''}<br><span style="color:var(--muted);font-size:17px">−${lost} points · combo reset.</span>`;
  }
  updateCombo();
  cleared++;
  $("#prog").style.width=(cleared/TOTAL*100)+"%";
  if(cleared>=TOTAL){
    fb.innerHTML+=`<div style="margin-top:14px"><button class="btn" onclick="quizSummary()">SEE RESULTS →</button></div>`;
  }
}

function animateNum(el,to){
  const from=parseInt(el.textContent)||0, dur=500, t0=performance.now();
  (function step(t){
    const k=Math.min(1,(t-t0)/dur);
    el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));
    if(k<1) requestAnimationFrame(step);
  })(t0);
}

function rankFor(c){
  if(c>=30) return {t:"🏆 CODE MASTER",col:"var(--gold)"};
  if(c>=27) return {t:"⭐ CHIEF RESIDENT",col:"var(--good)"};
  if(c>=22) return {t:"🩺 ATTENDING",col:"var(--quiz)"};
  if(c>=16) return {t:"💉 RESIDENT",col:"var(--purple)"};
  return {t:"🚑 ROOKIE — KEEP STUDYING",col:"var(--muted)"};
}

  "thoracic cage":"EMT — protects the heart & lungs; framework for chest-trauma assessment.",
  "axial skeleton":"EMT — skull + spine + chest: the body's central trauma core.",
  "ossification":"A&P foundation — how the skeleton is built and repaired.",
  "endochondral ossification":"Explains how long bones (most of the skeleton) form from cartilage.",
  "intramembranous ossification":"Explains how flat bones like the skull form.",
  "ossification center":"Foundational for reading bone growth on imaging.",
  "primary ossification center":"Helps interpret pediatric bone development on X-rays.",
  "secondary ossification center":"Marks growing bone ends — relevant to growth-plate injuries.",
  "perichondrium":"Background for cartilage growth and healing.",
  "modeling":"Explains how growing bones change shape.",
  "remodeling":"Key to fracture healing and to osteoporosis.",
  "projection":"Surface landmarks used to locate structures on a patient.",
  "osteoid":"Bone-matrix context behind calcium & vitamin-D labs.",
  "osteogenic cell":"The starting point of bone growth and repair.",
  "reserve zone":"Growth-plate anatomy — relevant to pediatric fractures.",
  "proliferative zone":"Why children's bones grow in length.",
  "zone of maturation and hypertrophy":"Part of how long bones elongate.",
  "zone of calcified matrix":"Final growth-plate zone before bone replaces cartilage.",
  "notochord":"Embryologic origin of the vertebral column.",
  "somite":"How the spine and ribs become segmented in development.",
  "sclerotome":"Direct embryologic origin of the axial skeleton.",
  "mesenchyme":"The source tissue for the whole skeleton and blood.",
  "growth hormone":"Endocrine — excess or deficiency shows up in growth & metabolism.",
  "ethmoid bone":"EMT — mid-face/orbit anatomy in facial trauma.",
  "sphenoid bone":"EMT — central skull base; basal fractures are serious.",
  "palatine bone":"EMT — palate/airway anatomy.",
  "lacrimal bone":"EMT — orbital anatomy in facial trauma.",
  "inferior nasal conchae":"EMT — nasal airway anatomy.",
  "vomer":"EMT — nasal septum; deviation and fractures."
};
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function culprit(){
  const uniq=[...new Set(missed)]; if(!uniq.length) return null;
  const tally={}; uniq.forEach(t=>{const c=CAT_OF[t]; tally[c]=(tally[c]||0)+1;});
  let topCat=null,topN=0; Object.keys(tally).forEach(c=>{if(tally[c]>topN){topN=tally[c];topCat=c;}});
  let term=null,topP=-1;
  uniq.filter(t=>CAT_OF[t]===topCat).forEach(t=>{ const p=((BOARD[topCat]||[]).find(i=>i.a===t)||{}).p||0; if(p>topP){topP=p;term=t;} });
  return {cat:topCat, domain:DOMAIN[topCat], term, danger:DANGER[term]||("complications from "+DOMAIN[topCat])};
}
function debrief(){
  const cu=culprit(); let verdict,tone,lineM,lineC;
  if(correct===TOTAL){
    tone="perfect"; verdict="DISCHARGED — FULL RECOVERY";
    lineM="Patient walked out in perfect health. Flawless shift, Doctor.";
    lineC="Thirty for thirty — the vitals never dipped once. Bravo!";
  } else if(patientHP>=70){
    tone="saved"; verdict="PATIENT SAVED";
    lineM=`Close call with ${cu.danger}, but you pulled them through.`;
    lineC=`Review ${cu.domain} (esp. "${cu.term}") — that's where they nearly slipped.`;
  } else if(patientHP>=40){
    tone="stable"; verdict="PATIENT STABILIZED";
    lineM=`${cap(cu.danger)} set us back hard — guarded, but breathing.`;
    lineC=`Tighten up ${cu.domain} and the next patient walks out the door.`;
  } else {
    tone="critical"; verdict="PATIENT CRITICAL";
    lineM=`Probable cause of the crash: ${cu.danger}.`;
    lineC=`Hit the books on ${cu.domain} (start with "${cu.term}"). Next shift, we save them.`;
  }
  const diagnosis = cu ? cap(cu.danger) : "Patient made a full recovery — no complications.";
  const diagLabel = tone==="perfect" ? "OUTCOME" : tone==="critical" ? "PROBABLE CAUSE OF ARREST" : "CLOSE CALL";
  if(codeBlueHappened && tone!=="perfect") lineM="We coded on the table — "+lineM.charAt(0).toLowerCase()+lineM.slice(1);
  return {verdict,tone,lineM,lineC,diagnosis,diagLabel};
}
function repAvatar(neon){
  const P=8, head=["..NNNN..",".CCCCCC.",".CCCCCC.",".CCCCCC.","..CCCC.."];
  const map={C:'coat',N:'neonfill'}; let s='';
  for(let r=0;r<head.length;r++)for(let c=0;c<head[r].length;c++){const cl=map[head[r][c]];if(cl)s+=`<rect class="${cl}" x="${c*P}" y="${r*P}" width="${P}" height="${P}"/>`;}
  s+=`<rect class="scr" x="${2*P}" y="${2*P}" width="${4*P}" height="${2*P}"/>`;
  s+=`<rect class="visor" x="${2*P+2}" y="${2*P+3}" width="${P-2}" height="${P-2}"/>`;
  s+=`<rect class="visor" x="${4*P}" y="${2*P+3}" width="${P-2}" height="${P-2}"/>`;
  s+=`<rect class="eyeshine" x="${2*P+3}" y="${2*P+4}" width="2" height="2"/>`;
  s+=`<rect class="eyeshine" x="${4*P+1}" y="${2*P+4}" width="2" height="2"/>`;
  return `<span class="repbot" style="--neon:${neon}"><svg viewBox="0 0 ${8*P} ${head.length*P}" class="repface">${s}</svg></span>`;
}

function quizSummary(){
  stopTimer();
  const rank=rankFor(correct);
  const uniqueMissed=[...new Set(missed)];
  react(correct>=22?'win':'lose'); setEmo(correct>=22?'great':'bad');
  if(correct>=22){ SFX.fanfare(); rain(140); } else { SFX.click(); }
  const missedHtml = uniqueMissed.length
    ? `<div class="rounds">
         <div class="rounds-head">${repAvatar('#ff3ca6')}${repAvatar('#2ad4ff')}
           <div class="rounds-cap">🩺 TEACHING ROUNDS<br><span>Doc, let's review what slipped — and why it matters on the job:</span></div>
         </div>
         <div class="reviewlist">
           ${uniqueMissed.map(t=>`<div class="review">
              <div class="rev-term">${t}</div>
              <div class="rev-def">${TERMS[t]}</div>
              <div class="rev-why"><b>WHY IT MATTERS</b>${RELEVANCE[t]||''}</div>
           </div>`).join("")}
         </div>
       </div>`
    : `<p style="color:var(--good);margin-top:18px;font-size:22px">🎉 FLAWLESS BOARD — EVERY TERM CORRECT!</p>`;
  const db=debrief();
  main.querySelector(".game").innerHTML=`
    <div class="done-screen">
      <div class="report">
        <div class="rep-title">📟 DOCTOR'S DEBRIEF</div>
        <div class="verdict ${db.tone}">${db.verdict}</div>
        <div class="diagnosis">🔬 ${db.diagLabel}<br><b>${db.diagnosis}</b></div>
        <div class="rep-line" style="animation-delay:.25s">${repAvatar('#ff3ca6')}<div class="rep-bubble m"><b>DR. MAGENTA</b><br>${db.lineM}</div></div>
        <div class="rep-line" style="animation-delay:.5s">${repAvatar('#2ad4ff')}<div class="rep-bubble c"><b>DR. CYAN</b><br>${db.lineC}</div></div>
      </div>
      <div class="rank-badge" style="color:${rank.col}">${rank.t}</div>
      <div class="big" id="finalScore">0</div>
      <div class="donestats">
        <div class="stat">CORRECT <b style="color:var(--good)">${correct}</b>/${TOTAL}</div>
        <div class="stat">PATIENT <b>${patientHP}% HP</b></div>
        <div class="stat">BEST COMBO <b>${maxStreak}🔥</b></div>
        <div class="stat">MAX MULTI <b>x${multiplierFor(maxStreak)}</b></div>
      </div>
      ${missedHtml}
      <div style="margin-top:22px;display:flex;gap:10px;justify-content:center">
        <button class="btn" onclick="renderQuiz()">PLAY AGAIN</button>
      </div>
    </div>`;
  animateNum($("#finalScore"),score);
}

renderQuiz();
</script>
